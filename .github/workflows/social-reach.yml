name: That day social reach

# Host-side Agent-Reach runner for the Replay "That day" strip. Nothing here ships to the browser.
# GitHub OIDC is the default ingest authentication, so the scheduled collector does not require a
# duplicated long-lived shared secret. SOCIAL_INGEST_TOKEN remains an optional compatibility fallback.
# TWITTER_AUTH_TOKEN / TWITTER_CT0 are optional and must belong to a dedicated account, never the owner's main X account.
#
# Supply chain: actions are pinned to commit SHAs, Agent-Reach to commit
# a19a171fa980a0785849596492e0af4db800c82f, twitter-cli==0.8.5, and mcporter@0.14.2.
# Install runs in a job with contents: read only. That job does not get id-token permission and does
# not receive the X cookie values, so package setup scripts cannot mint the ingest token or read the
# dedicated account cookies. The drain job opts into id-token: write and passes the cookies only to
# the collector step. mcporter is installed with a workspace prefix.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Cloudflare"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: social-reach
  cancel-in-progress: false

jobs:
  prepare:
    name: Install pinned Agent-Reach backends
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # mcporter@0.14.2 declares engines.node >= 24.
          node-version: "24"
      - name: Install Agent-Reach fork and backends
        env:
          # Boolean only. Cookie values are not exported into this job.
          INSTALL_TWITTER_CLI: ${{ secrets.TWITTER_AUTH_TOKEN != '' && secrets.TWITTER_CT0 != '' }}
        run: |
          set -euo pipefail
          python -m venv "$GITHUB_WORKSPACE/.social-venv"
          "$GITHUB_WORKSPACE/.social-venv/bin/pip" install --quiet "git+https://github.com/solanack/Agent-Reach.git@a19a171fa980a0785849596492e0af4db800c82f"
          if [ "$INSTALL_TWITTER_CLI" = "true" ]; then
            "$GITHUB_WORKSPACE/.social-venv/bin/pip" install --quiet "twitter-cli==0.8.5"
          fi
          npm install --prefix "$GITHUB_WORKSPACE/.social-tools" --silent "mcporter@0.14.2"
      - name: Upload installed backends
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: social-reach-tools
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            .social-venv
            .social-tools

  reach:
    name: Run That day collector
    needs: prepare
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      INTELLIGENCE_ORIGIN: https://www.abullsapp.com
      SOCIAL_FORCE_EMPTY_RETRY: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Download installed backends
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: social-reach-tools
          path: .
      - name: Configure Exa for mcporter
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.social-tools/node_modules/.bin:$PATH"
          mcporter config add exa https://mcp.exa.ai/mcp --scope home || true
      - name: Request short-lived GitHub OIDC ingest token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=abullsapp-social-ingest")"
          token="$(node -e 'const fs=require("fs");const body=JSON.parse(fs.readFileSync(0,"utf8"));if(!body.value)process.exit(2);process.stdout.write(body.value)' <<<"$response")"
          echo "::add-mask::$token"
          echo "GITHUB_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Drain That day requests
        env:
          SOCIAL_INGEST_TOKEN: ${{ secrets.SOCIAL_INGEST_TOKEN }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.social-venv/bin:$GITHUB_WORKSPACE/.social-tools/node_modules/.bin:$PATH"
          python scripts/social-reach/runner.py
