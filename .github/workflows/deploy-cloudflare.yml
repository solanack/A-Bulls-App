name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  release-checks:
    name: Test and build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Verify release baseline
        run: npm run verify:release
      - name: All repository tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build production frontend
        env:
          CF_DEPLOY: "1"
        run: npm run build
      - name: Intelligence Worker dry-run
        run: npx wrangler deploy --dry-run --config workers/wrangler.production.toml
      - name: Frontend Worker dry-run using generated configuration
        run: |
          test -f .wrangler/deploy/config.json
          npx wrangler deploy --dry-run
      - name: Inventory every generated frontend file
        run: |
          test -f dist/server/wrangler.json
          find dist .wrangler public/release.json -type f -print0 | sort -z | xargs -0 sha256sum > release-artifact.sha256
          test -s release-artifact.sha256
      - name: Upload exact tested frontend release
        uses: actions/upload-artifact@v4
        with:
          name: tested-frontend-${{ github.sha }}
          path: |
            dist
            .wrangler
            public/release.json
            release-artifact.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish tested release artifacts
    needs: release-checks
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Require deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN to repository Actions secrets. Nothing was deployed."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID to repository Actions secrets. Nothing was deployed."; exit 1; }
      - name: Install deployment tooling
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Install Chromium for production browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Download exact tested frontend release
        uses: actions/download-artifact@v4
        with:
          name: tested-frontend-${{ github.sha }}
          path: .
      - name: Verify downloaded frontend configuration and release identity
        run: |
          test -f .wrangler/deploy/config.json
          test -f public/release.json
          test -f release-artifact.sha256
          sha256sum --check --strict release-artifact.sha256
          node -e 'const r=require("./public/release.json"); if(r.commit!==process.env.GITHUB_SHA) throw new Error(`artifact commit ${r.commit} != ${process.env.GITHUB_SHA}`)'
      - name: Frontend dry-run from downloaded tested artifact
        run: npx wrangler deploy --dry-run
      - name: Inspect pending Intelligence D1 migrations
        run: |
          node scripts/check-worker-migrations.mjs
          npx wrangler d1 migrations list INTELLIGENCE_DB --remote --config workers/wrangler.production.toml | tee pending-intelligence-migrations.txt
      - name: Discover retained replay evidence fixture
        run: |
          set -euo pipefail
          SQL=$(cat <<'SQL'
          WITH candidate_rounds AS (
            SELECT
              id AS round_id,
              wallet,
              mint,
              status,
              CAST(entry_ts / 1000 AS INTEGER) AS from_ts,
              CAST(COALESCE(exit_ts, entry_ts + 3600000) / 1000 AS INTEGER) AS to_ts,
              updated_at
            FROM matched_trade_rounds
            WHERE status IN ('closed','open')
              AND entry_ts IS NOT NULL
              AND wallet IS NOT NULL AND wallet <> ''
              AND mint IS NOT NULL AND mint <> ''
          ), eligible AS (
            SELECT r.*
            FROM candidate_rounds r
            WHERE r.to_ts >= r.from_ts
              AND EXISTS (
                SELECT 1
                FROM intelligence_price_candles c
                WHERE c.mint = r.mint
                  AND c.quote_mint = 'So11111111111111111111111111111111111111112'
                  AND c.bucket_seconds = 60
                  AND c.bucket_start BETWEEN r.from_ts AND r.to_ts
              )
          )
          SELECT
            r.round_id,
            r.wallet,
            r.mint,
            r.from_ts,
            r.to_ts,
            r.status,
            r.updated_at,
            e.signature,
            e.block_time
          FROM eligible r
          JOIN bull_wallet_events e
            ON e.wallet = r.wallet
           AND e.mint = r.mint
           AND e.block_time BETWEEN r.from_ts AND r.to_ts
          WHERE e.signature IS NOT NULL AND e.signature <> ''
          ORDER BY CASE WHEN r.status='closed' THEN 0 ELSE 1 END, r.updated_at DESC, e.block_time ASC
          LIMIT 500;
          SQL
          )
          npx wrangler d1 execute INTELLIGENCE_DB --remote --config workers/wrangler.production.toml --json --command "$SQL" > retained-live-evidence-query.json
          node scripts/select-live-evidence-fixture.mjs retained-live-evidence-query.json | tee retained-live-evidence.json
      - name: Validate retained production evidence before mutation
        run: |
          set -o pipefail
          node scripts/check-live.mjs --fixture-only | tee retained-live-fixture.json
      - name: Apply intelligence migrations
        run: npx wrangler d1 migrations apply INTELLIGENCE_DB --remote --config workers/wrangler.production.toml
      - name: Publish intelligence worker
        run: npx wrangler deploy --config workers/wrangler.production.toml
      - name: Publish frontend worker
        run: npx wrangler deploy
      - name: Verify public application and resolver routes
        run: node scripts/check-live.mjs
      - name: Verify multichain evidence spine
        run: node scripts/check-multichain-live.mjs | tee multichain-live-status.json
      - name: Audit every current Fomo trader-token Replay
        run: node scripts/audit-fomo-replay-coverage.mjs
      - name: Capture multichain D1 population
        if: always()
        run: |
          SQL=$(cat <<'SQL'
          SELECT 'fomo_positions' AS dataset,
                 COALESCE(NULLIF(LOWER(TRIM(chain)),''),NULLIF(LOWER(TRIM(network_id)),''),'unknown') AS chain_key,
                 COUNT(*) AS count
          FROM fomo_trader_positions
          GROUP BY 1,2
          UNION ALL
          SELECT 'fomo_trades' AS dataset,
                 COALESCE(NULLIF(LOWER(TRIM(chain)),''),'unknown') AS chain_key,
                 COUNT(*) AS count
          FROM fomo_trader_trades
          GROUP BY 1,2
          UNION ALL
          SELECT 'assets_v2',chain_key,COUNT(*) FROM intelligence_chain_assets_v2 GROUP BY 1,2
          UNION ALL
          SELECT 'markets_v2',chain_key,COUNT(*) FROM intelligence_market_snapshots_v2 GROUP BY 1,2
          UNION ALL
          SELECT 'events_v2',chain_key,COUNT(*) FROM intelligence_chain_events_v2 GROUP BY 1,2
          ORDER BY dataset,chain_key;
          SQL
          )
          npx wrangler d1 execute INTELLIGENCE_DB --remote --config workers/wrangler.production.toml --json --command "$SQL" | tee multichain-d1-diagnostic.json
      - name: Diagnose sparse Replay hydration
        run: node scripts/diagnose-replay-production.mjs | tee replay-hydration-diagnostic.json
      - name: Verify deployed Field in desktop and mobile Chromium
        env:
          BROWSER_ALLOW_EXTERNAL_HOST: "1"
        run: |
          set -euo pipefail
          sudo mkdir -p /workspace/screenshots
          sudo chown -R "$USER":"$USER" /workspace
          node scripts/browser-smoke.mjs https://abullsapp.com/ /workspace/screenshots/production-field.png
          node scripts/browser-smoke.mjs "https://abullsapp.com/?galaxy=afterbell" /workspace/screenshots/production-afterbell.png
          node scripts/browser-afterbell-live-journey.mjs https://abullsapp.com /workspace/screenshots/afterbell-live-journey.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root=JSON.parse(fs.readFileSync("/workspace/screenshots/production-field.json","utf8"));
          const afterbell=JSON.parse(fs.readFileSync("/workspace/screenshots/production-afterbell.json","utf8"));
          for(const [label,verdict] of [["root",root],["afterbell",afterbell]]){
            const entries=Object.entries(verdict.viewports||{});
            if(entries.length!==2)throw new Error(label+" browser smoke did not return both viewports");
            for(const [name,row] of entries){
              if(Number(row.status)!==200)throw new Error(label+" "+name+" returned HTTP "+String(row.status));
              if(row.hasCanvas!==true)throw new Error(label+" "+name+" Field canvas is missing");
              if(row.horizontalOverflow===true)throw new Error(label+" "+name+" has horizontal overflow");
              if((row.consoleErrors||[]).length)throw new Error(label+" "+name+" has console errors: "+row.consoleErrors.join(" | "));
              if((row.pageErrors||[]).length)throw new Error(label+" "+name+" has page errors: "+row.pageErrors.join(" | "));
            }
          }
          for(const [name,row] of Object.entries(afterbell.viewports||{})){
            if(row.fieldState?.galaxy!=="afterbell")throw new Error("Afterbell "+name+" did not hydrate the integrated Afterbell galaxy");
            if(row.fieldState?.section!=="galaxy")throw new Error("Afterbell "+name+" did not remain in the trader-star galaxy section");
            if(!Number.isFinite(Number(row.fieldState?.count))||Number(row.fieldState.count)<=0)throw new Error("Afterbell "+name+" hydrated with zero trader STARS");
          }
          NODE
          rm -rf production-browser-smoke
          mkdir -p production-browser-smoke
          cp /workspace/screenshots/production-field* /workspace/screenshots/production-afterbell* /workspace/screenshots/afterbell-live-journey.json production-browser-smoke/
      - name: Capture Replay history source health
        if: always()
        continue-on-error: true
        run: |
          SQL=$(cat <<'SQL'
          SELECT source,source_kind,state,last_ok_at,last_error_at,latency_ms,details_json,updated_at
          FROM intelligence_source_health
          WHERE source IN ('helius-getTransactionsForAddress','helius-standard-rpc','solana-public-rpc','multichain-reconciliation')
             OR source LIKE 'configured-rpc%'
          ORDER BY updated_at DESC;
          SQL
          )
          npx wrangler d1 execute INTELLIGENCE_DB --remote --config workers/wrangler.production.toml --json --command "$SQL" | tee replay-history-source-health.json
      - name: Upload pre-mutation release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-preflight-${{ github.sha }}
          path: |
            pending-intelligence-migrations.txt
            retained-live-evidence-query.json
            retained-live-evidence.json
            retained-live-fixture.json
            multichain-live-status.json
            fomo-replay-audit.json
            fomo-replay-audit-summary.json
            multichain-d1-diagnostic.json
            replay-hydration-diagnostic.json
            replay-history-source-health.json
            production-browser-smoke
          if-no-files-found: warn
          retention-days: 14