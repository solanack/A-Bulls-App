name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  release-checks:
    name: Required release checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Verify release baseline
        run: npm run verify:release
      - name: All repository tests
        run: npm test
      - name: TypeScript checks
        run: npm run typecheck
      - name: Build production frontend
        env:
          CF_DEPLOY: "1"
        run: npm run build
      - name: Bundle intelligence worker before touching production
        run: npx wrangler deploy --dry-run --config workers/wrangler.production.toml

  deploy:
    name: Migrate, publish, and verify production
    needs: release-checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://abullsapp.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_DEPLOY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Require deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN to the production environment or repository Actions secrets. Nothing was deployed."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID to the production environment or repository Actions secrets. Nothing was deployed."; exit 1; }
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Recheck deployable bundles before touching production
        run: |
          npx wrangler deploy --dry-run --config workers/wrangler.production.toml
          npx wrangler deploy --dry-run
      - name: Inspect pending Intelligence D1 migrations
        run: npx wrangler d1 migrations list INTELLIGENCE_DB --remote --config workers/wrangler.production.toml
      - name: Apply intelligence migrations
        run: npx wrangler d1 migrations apply INTELLIGENCE_DB --remote --config workers/wrangler.production.toml
      - name: Publish intelligence worker
        run: npx wrangler deploy --config workers/wrangler.production.toml
      - name: Publish frontend worker
        run: npx wrangler deploy
      - name: Verify public application and resolver routes
        run: node scripts/check-live.mjs
      - name: Diagnose live galaxy population
        continue-on-error: true
        run: node scripts/diagnose-live-galaxies.mjs
      - name: Diagnose Pons production state
        if: always()
        continue-on-error: true
        run: node scripts/diagnose-pons-production.mjs | tee pons-production-diagnostic.txt
      - name: Upload Pons production diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pons-production-diagnostic
          path: pons-production-diagnostic.txt
          if-no-files-found: error
          retention-days: 3
