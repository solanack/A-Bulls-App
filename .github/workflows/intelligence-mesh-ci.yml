name: Intelligence Mesh CI

on:
  push:
    branches: [ feature/intelligence-mesh-v1, feature/universe-trickster-v1 ]
    paths:
      - 'workers/intelligence-*.mjs'
      - 'js/intelligence-workspace-*.mjs'
      - 'js/replay-*.mjs'
      - 'js/trade-*.mjs'
      - 'js/temporal-*.mjs'
      - 'workers/migrations/0009_intelligence_mesh.sql'
      - 'workers/migrations/0010_intelligence_mesh_runtime.sql'
      - 'docs/INTELLIGENCE-MESH.md'
      - 'docs/INTELLIGENCE-MESH-BUILD-STATUS.md'
      - '.github/workflows/intelligence-mesh-ci.yml'
  pull_request:
    paths:
      - 'workers/intelligence-*.mjs'
      - 'js/intelligence-workspace-*.mjs'
      - 'js/replay-*.mjs'
      - 'js/trade-*.mjs'
      - 'js/temporal-*.mjs'
      - 'workers/migrations/0009_intelligence_mesh.sql'
      - 'workers/migrations/0010_intelligence_mesh_runtime.sql'
      - 'docs/INTELLIGENCE-MESH.md'
      - 'docs/INTELLIGENCE-MESH-BUILD-STATUS.md'
      - '.github/workflows/intelligence-mesh-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          set -euo pipefail
          for f in workers/intelligence-*.mjs; do node --check "$f"; done
          for f in js/intelligence-workspace-*.mjs js/replay-*.mjs js/trade-*.mjs js/temporal-*.mjs; do
            [ -e "$f" ] && node --check "$f"
          done
      - name: Unit tests
        run: |
          node --test workers/intelligence-*.test.mjs
          node --test js/temporal-replay-engine.test.mjs js/trade-comparison-replay.test.mjs
      - name: Neutral data contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq 'BULL_MESH_ENABLED|BULL_MESH_INGEST_TOKEN|bull_index_coverage|bull_source_health|bull_price_candles|bull_trade_routes' workers/intelligence-mesh-*.mjs workers/intelligence-adapter*.mjs workers/intelligence-history-engine.mjs workers/intelligence-product-layer.mjs workers/intelligence-simulations.mjs workers/intelligence-router-vnext.mjs workers/intelligence-nft-layer.mjs workers/intelligence-operations.mjs workers/intelligence-replay-bundle.mjs workers/migrations/0010_intelligence_mesh_runtime.sql
      - name: Migration safety contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CREATE TABLE IF NOT EXISTS intelligence_index_coverage' workers/migrations/0010_intelligence_mesh_runtime.sql
          grep -q 'CREATE TABLE IF NOT EXISTS intelligence_demand_patterns' workers/migrations/0010_intelligence_mesh_runtime.sql
          ! grep -Eiq 'community_integrations|ansem|bullpen' workers/migrations/0010_intelligence_mesh_runtime.sql
          ! grep -Eiq 'DROP[[:space:]]+TABLE|TRUNCATE|DELETE[[:space:]]+FROM' workers/migrations/0010_intelligence_mesh_runtime.sql
      - name: Progressive history contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'getSignaturesForAddress' workers/intelligence-history-engine.mjs
          grep -q 'getTransaction' workers/intelligence-history-engine.mjs
          grep -q 'INTELLIGENCE_RPC_URL' workers/intelligence-history-engine.mjs
          grep -q 'intelligence_index_jobs' workers/intelligence-mesh-scheduler.mjs
      - name: Product feature contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/intelligence/wallet-dna' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/time-machine' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/chain-lens' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/ghost-portfolio' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/parallel-universe' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/chain-radar' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/chain-weather' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/nft-memory' workers/intelligence-asset-router.mjs
          grep -q '/api/intelligence/replay-bundle' workers/intelligence-replay-bundle.mjs
          grep -q 'PLAYABLE_DATA_ENABLED' workers/intelligence-replay-bundle.mjs
          ! grep -Eiq 'community-integrations|ansem|bullpen' workers/intelligence-asset-router.mjs workers/intelligence-operations.mjs
      - name: Read-only guardrails
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq 'sendTransaction|signTransaction|secretKey|seed phrase|private[_ -]?key' workers/intelligence-*.mjs js/intelligence-workspace-*.mjs js/replay-*.mjs js/trade-*.mjs js/temporal-*.mjs
