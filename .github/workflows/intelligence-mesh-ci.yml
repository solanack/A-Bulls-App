name: Intelligence Mesh CI

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          set -euo pipefail
          for f in workers/intelligence-*.mjs; do node --check "$f"; done
          for f in js/intelligence-workspace-*.mjs js/replay-*.mjs js/trade-*.mjs js/temporal-*.mjs; do
            [ -e "$f" ] && node --check "$f"
          done
          node --check services/intelligence-bridge/runner.mjs
      - name: Unit tests
        run: |
          node --test workers/intelligence-*.test.mjs
          node --test js/temporal-replay-engine.test.mjs js/trade-comparison-replay.test.mjs
          node --test services/intelligence-bridge/runner.test.mjs
      - name: Neutral data contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq 'BULL_MESH_ENABLED|BULL_MESH_INGEST_TOKEN|bull_index_coverage|bull_source_health|bull_price_candles|bull_trade_routes' workers/intelligence-mesh-*.mjs workers/intelligence-adapter*.mjs workers/intelligence-history-engine.mjs workers/intelligence-history-orchestrator.mjs workers/intelligence-source-selection.mjs workers/intelligence-retrieval-tasks.mjs workers/intelligence-product-layer.mjs workers/intelligence-simulations.mjs workers/intelligence-router-vnext.mjs workers/intelligence-nft-layer.mjs workers/intelligence-operations.mjs workers/intelligence-replay-bundle.mjs workers/migrations/0010_intelligence_mesh_runtime.sql workers/migrations/0012_history_job_depth.sql workers/migrations/0013_external_retrieval_tasks.sql
      - name: Migration safety contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CREATE TABLE IF NOT EXISTS intelligence_index_coverage' workers/migrations/0010_intelligence_mesh_runtime.sql
          grep -q 'CREATE TABLE IF NOT EXISTS intelligence_demand_patterns' workers/migrations/0010_intelligence_mesh_runtime.sql
          grep -q 'ADD COLUMN requested_from INTEGER' workers/migrations/0012_history_job_depth.sql
          grep -q 'ADD COLUMN requested_to INTEGER' workers/migrations/0012_history_job_depth.sql
          grep -q 'CREATE TABLE IF NOT EXISTS intelligence_retrieval_tasks' workers/migrations/0013_external_retrieval_tasks.sql
          grep -q 'lease_until INTEGER' workers/migrations/0013_external_retrieval_tasks.sql
          grep -q 'range_verified INTEGER' workers/migrations/0013_external_retrieval_tasks.sql
          grep -q 'result_json TEXT' workers/migrations/0013_external_retrieval_tasks.sql
          ! grep -Eiq 'community_integrations|ansem|bullpen' workers/migrations/0010_intelligence_mesh_runtime.sql workers/migrations/0012_history_job_depth.sql workers/migrations/0013_external_retrieval_tasks.sql
          ! grep -Eiq 'DROP[[:space:]]+TABLE|TRUNCATE|DELETE[[:space:]]+FROM' workers/migrations/0010_intelligence_mesh_runtime.sql workers/migrations/0012_history_job_depth.sql workers/migrations/0013_external_retrieval_tasks.sql
      - name: Progressive history contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'getSignaturesForAddress' workers/intelligence-history-engine.mjs
          grep -q 'getTransaction' workers/intelligence-history-engine.mjs
          grep -q 'INTELLIGENCE_RPC_URL' workers/intelligence-history-orchestrator.mjs
          grep -q 'INTELLIGENCE_RPC_FALLBACK_URLS' workers/intelligence-history-orchestrator.mjs
          grep -q 'INTELLIGENCE_SUBSTREAMS_HISTORY_ENABLED' workers/intelligence-history-orchestrator.mjs
          grep -q 'INTELLIGENCE_OLD_FAITHFUL_HISTORY_ENABLED' workers/intelligence-history-orchestrator.mjs
          grep -q 'loadObservedSourceHealth' workers/intelligence-history-orchestrator.mjs
          grep -q 'buildRetrievalPlan' workers/intelligence-history-orchestrator.mjs
          grep -q 'runSourceAwareHistoryPass' workers/intelligence-mesh-scheduler.mjs
          grep -q 'requested_from' workers/intelligence-mesh-scheduler.mjs
          grep -q 'requested_to' workers/intelligence-mesh-scheduler.mjs
          grep -q 'waiting-external' workers/intelligence-mesh-scheduler.mjs workers/intelligence-index-job-status.mjs
          grep -q 'INTELLIGENCE_EXTERNAL_RETRIEVAL_ENABLED' workers/intelligence-retrieval-tasks.mjs
          grep -q 'normalizeRetrievalReceipt' workers/intelligence-retrieval-tasks.mjs
          grep -q 'requestedWindowSatisfied' workers/intelligence-retrieval-tasks.mjs
          grep -q '/api/internal/intelligence/retrieval-tasks/claim' workers/intelligence-retrieval-tasks.mjs
          grep -q '/api/internal/intelligence/retrieval-tasks/finish' workers/intelligence-retrieval-tasks.mjs
          grep -q 'handleExternalRetrievalTaskRequest' workers/intelligence-worker-hooks.mjs
          grep -q 'handleIntelligenceMeshIngestRequest' workers/intelligence-worker-hooks.mjs
          grep -q 'handleIntelligenceAdapterRequest' workers/intelligence-worker-hooks.mjs
          grep -q 'finishExternalRetrievalTask' workers/intelligence-adapter-router.mjs
          grep -q 'rangeVerified' workers/intelligence-adapter-router.mjs
          grep -q 'unknown-until-measured' workers/intelligence-source-selection.mjs
      - name: External bridge contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'retrieval-tasks/claim' services/intelligence-bridge/runner.mjs
          grep -q 'retrieval-tasks/finish' services/intelligence-bridge/runner.mjs
          grep -q 'rangeVerified' services/intelligence-bridge/runner.mjs
          grep -q 'bridge_executor_unavailable' services/intelligence-bridge/runner.mjs
          ! grep -Eiq 'sendTransaction|signTransaction|secretKey|seed phrase|private[_ -]?key' services/intelligence-bridge/*.mjs
      - name: Product feature contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/intelligence/wallet-dna' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/time-machine' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/chain-lens' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/ghost-portfolio' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/parallel-universe' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/chain-radar' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/chain-weather' workers/intelligence-mesh-router.mjs
          grep -q '/api/intelligence/nft-memory' workers/intelligence-asset-router.mjs
          grep -q '/api/intelligence/replay-bundle' workers/intelligence-replay-bundle.mjs
          grep -q 'PLAYABLE_DATA_ENABLED' workers/intelligence-replay-bundle.mjs
          ! grep -Eiq 'community-integrations|ansem|bullpen' workers/intelligence-asset-router.mjs workers/intelligence-operations.mjs
      - name: Read-only guardrails
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq 'sendTransaction|signTransaction|secretKey|seed phrase|private[_ -]?key' workers/intelligence-*.mjs js/intelligence-workspace-*.mjs js/replay-*.mjs js/trade-*.mjs js/temporal-*.mjs services/intelligence-bridge/*.mjs
