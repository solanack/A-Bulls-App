name: Final hackathon completion pass
on:
  push:
    paths:
      - '.github/workflows/final-hackathon-pass.yml'
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply replay, sound, Afterbell, and social evidence upgrades
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('workers/intelligence-replay-bundle.mjs'); t=p.read_text()
          if 'const REPLAY_PRE_ROLL_SECONDS=' not in t:
              t=t.replace('const MAX_WINDOW_SECONDS=60*60*24*365*15;','const MAX_WINDOW_SECONDS=60*60*24*365*15;\nconst REPLAY_PRE_ROLL_SECONDS=7*24*60*60;\nconst TARGET_REPLAY_CANDLES=240;\nconst REPLAY_BUCKET_LADDER=Object.freeze([60,300,900,3600,14400,43200,86400]);')
          t=re.sub(r'export function adaptiveReplayBucketSeconds\(from,to,requested=0\)\{.*?\n\}', 'export function adaptiveReplayBucketSeconds(from,to,requested=0){\n  const span=Math.max(0,Math.trunc(n(to))-Math.trunc(n(from))),asked=Math.max(0,Math.trunc(n(requested)));\n  const densityFloor=Math.max(60,Math.ceil(span/TARGET_REPLAY_CANDLES));\n  const automatic=REPLAY_BUCKET_LADDER.find(value=>value>=densityFloor)||86400;\n  const requestedBucket=asked?(REPLAY_BUCKET_LADDER.find(value=>value>=asked)||86400):60;\n  return Math.max(automatic,requestedBucket);\n}',t,count=1,flags=re.S)
          old="const resolvedTo=rawTo!=null&&rawTo!==''?requestedTo:Math.max(anchor.from,Math.trunc(n(anchor.to)||requestedTo)),low=Math.min(anchor.from,resolvedTo),high=Math.max(anchor.from,resolvedTo);"
          if old in t:
              t=t.replace(old,"const resolvedTo=rawTo!=null&&rawTo!==''?requestedTo:Math.max(anchor.from,Math.trunc(n(anchor.to)||requestedTo)),entry=Math.min(anchor.from,resolvedTo),low=Math.max(0,entry-REPLAY_PRE_ROLL_SECONDS),high=Math.max(anchor.from,resolvedTo);")
              t=t.replace('startRef:anchor.ref});','startRef:anchor.ref,entryTime:anchor.from,preRollSeconds:anchor.from-low});',1)
          t=t.replace('actualTradeEntryStart:true,noArbitraryLookback:true','actualTradeEntryStart:true,sevenDayPreEntryContext:true,targetReplayCandles:TARGET_REPLAY_CANDLES,noArbitraryLookback:true')
          p.write_text(t)

          p=Path('src/components/universe-workspace.tsx'); t=p.read_text()
          old='function replayRequest(wallet:string,mint:string,quoteMint:string){const thread=loadResearchThread(),sameSubject=Boolean(wallet&&mint&&thread.wallet===wallet&&thread.mint===mint),selectedWindow=sameSubject&&thread.fromTs&&thread.toTs&&!thread.replayRef?{from:Math.floor(thread.fromTs/1000),to:Math.ceil(thread.toTs/1000)}:{};return{wallets:[wallet].filter(Boolean),mint,quoteMint,bucketSeconds:60,...selectedWindow};}'
          new='function replayRequest(wallet:string,mint:string,quoteMint:string){const thread=loadResearchThread(),sameSubject=Boolean(wallet&&mint&&thread.wallet===wallet&&thread.mint===mint),selectedWindow=sameSubject&&thread.toTs&&!thread.replayRef?{to:Math.ceil(thread.toTs/1000)}:{};return{wallets:[wallet].filter(Boolean),mint,quoteMint,...(sameSubject&&thread.chainKey?{chainKey:thread.chainKey}:{}),bucketSeconds:60,...selectedWindow};}'
          if old in t:t=t.replace(old,new,1)
          p.write_text(t)

          p=Path('src/components/replay-workspace.tsx'); t=p.read_text()
          if 'function playTradeCue(' not in t:
              a='const MAX_HYDRATION_ATTEMPTS=18;'
              b='const MAX_HYDRATION_ATTEMPTS=18;\nfunction playTradeCue(side:string){try{const Ctx=window.AudioContext;if(!Ctx)return;const ctx=new Ctx(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type="sine";osc.frequency.value=side==="buy"?740:240;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.05,ctx.currentTime+.012);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.16);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.17);osc.onended=()=>void ctx.close();}catch{}}'
              if a not in t:raise SystemExit('replay constant anchor missing')
              t=t.replace(a,b,1)
          if 'soundedEventRef' not in t:
              a='const frameRef=useRef<number|undefined>(undefined),lastFrameRef=useRef<number|undefined>(undefined);'
              if a not in t:raise SystemExit('replay ref anchor missing')
              t=t.replace(a,a+'\n  const soundedEventRef=useRef<string>("");',1)
              a='const movieBeat=currentEvent?`${text(currentEvent.side??currentEvent.kind??"OBSERVED EVENT").toUpperCase()} · ${formatDate(num(currentEvent.timestamp))}`:"WAITING FOR FIRST INDEXED EVENT";'
              if a not in t:raise SystemExit('movie beat anchor missing')
              t=t.replace(a,a+'\n  useEffect(()=>{if(!playing||!currentEvent)return;const side=text(currentEvent.side).toLowerCase();if(side!=="buy"&&side!=="sell")return;const key=text(currentEvent.signature??currentEvent.id??currentEvent.timestamp);if(!key||soundedEventRef.current===key)return;soundedEventRef.current=key;playTradeCue(side);},[playing,currentEvent]);',1)
          p.write_text(t)

          p=Path('src/components/app-shell.tsx'); t=p.read_text(); a='{GALAXY_ORIGIN_CHIPS.map(chip=>'
          if 'Enter Afterbell Galaxy' not in t:
              if a not in t:raise SystemExit('galaxy anchor missing')
              t=t.replace(a,'<a href="/afterbell/" className="galaxy-chip" aria-label="Enter Afterbell Galaxy">AFTERBELL</a>{GALAXY_ORIGIN_CHIPS.map(chip=>',1)
          p.write_text(t)

          p=Path('scripts/check-live.mjs'); t=p.read_text(); a='const html = await getText(baseUrl);'
          if 'Afterbell Galaxy deep link must be deployed' not in t and a in t:
              t=t.replace(a,a+'\nconst afterbellHtml = await getText(`${baseUrl}/afterbell/`);\nassert.match(afterbellHtml,/AFTERBELL/i,"Afterbell Galaxy deep link must be deployed");',1)
          p.write_text(t)

          Path('SOCIAL_EVIDENCE_ADAPTER.md').write_text('# Social Evidence Adapter\n\nA Bulls correlates timestamped social observations with Research Threads across T-7 days through the observed trade lifecycle. Acquisition is adapted from `solanack/Agent-Reach` for X/Twitter, Reddit, YouTube, RSS and web retrieval. Every observation retains platform, canonical id/URL, public author when available, published/observed timestamp, retrieval timestamp, query and provenance. Records are PROVIDER-REPORTED unless independently verified; missing coverage is UNAVAILABLE, never zero. No synthetic sentiment, causal, or identity claim is permitted. Production collection must be bounded, deduplicated, normalized to Evidence IDs and attached to Research Threads for Replay, Grey and Trickster correlation.\n')
          Path('scripts/replay-cinematic-contract.test.mjs').write_text('import assert from "node:assert/strict";import test from "node:test";import {adaptiveReplayBucketSeconds,__replayBundleContract} from "../workers/intelligence-replay-bundle.mjs";test("adaptive replay",()=>{assert.equal(adaptiveReplayBucketSeconds(0,15*60*200,60),900);assert.ok(adaptiveReplayBucketSeconds(0,7*86400,60)>=300)});test("pre-entry context",()=>{assert.equal(__replayBundleContract.sevenDayPreEntryContext,true);assert.equal(__replayBundleContract.targetReplayCandles,240)});')
          PY
      - name: Verify
        run: |
          npm install --ignore-scripts
          npm run typecheck
          npm test
          npm run build
      - name: Commit and release
        run: |
          git config user.name "A Bulls Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add workers/intelligence-replay-bundle.mjs src/components/universe-workspace.tsx src/components/replay-workspace.tsx src/components/app-shell.tsx scripts/check-live.mjs scripts/replay-cinematic-contract.test.mjs SOCIAL_EVIDENCE_ADAPTER.md
          git commit -m "feat: finish hackathon replay and Afterbell integration"
          git push origin HEAD:main
