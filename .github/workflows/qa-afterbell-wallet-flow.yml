name: Verify Afterbell wallet research flow

on:
  push:
    branches: [feat/afterbell-top50-wallet-query]
    paths:
      - .github/workflows/qa-afterbell-wallet-flow.yml
      - src/lib/field/wallet-system.test.ts
      - src/lib/universe-data/wallet-system-client.ts
      - src/lib/field/wallet-system.ts
      - workers/intelligence-token-system.mjs
      - workers/intelligence-wallet-token-index.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/afterbell-top50-wallet-query
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch Field wallet navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/field/field-os.ts')
          text=p.read_text()
          def replace(old,new,label):
              global text
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              text=text.replace(old,new,1)
          replace('import { getAfterbellGalaxy } from "@/lib/universe-data/afterbell-client";','import { getAfterbellGalaxy } from "@/lib/universe-data/afterbell-client";\nimport { getWalletSystem, type WalletSystemResponse } from "@/lib/universe-data/wallet-system-client";','wallet client import')
          replace('import { buildFomoTraderSystemSnapshot } from "./fomo-trader-system";','import { buildFomoTraderSystemSnapshot } from "./fomo-trader-system";\nimport { buildWalletSystemSnapshot } from "./wallet-system";','wallet builder import')
          old='if(particle.cosmicKind==="star"&&particle.metadata?.fomoTrader===true&&this.galaxy.id==="fomo"&&this.fieldSection.kind==="galaxy"){void this.enterFomoTraderSystem(particle);return;}if(this.fieldSection.kind==="trader-system"&&(particle.cosmicKind==="comet"||particle.cosmicKind==="planet")&&mint)'
          new='if(particle.cosmicKind==="star"&&particle.metadata?.fomoTrader===true&&this.galaxy.id==="fomo"&&this.fieldSection.kind==="galaxy"){void this.enterFomoTraderSystem(particle);return;}if(this.fieldSection.kind==="token-system"&&particle.cosmicKind==="star"&&particle.metadata?.rankingMode==="afterbell-traders"&&typeof particle.metadata?.wallet==="string"){void this.enterWalletSystem(particle.metadata.wallet);return;}if(this.fieldSection.kind==="trader-system"&&(particle.cosmicKind==="comet"||particle.cosmicKind==="planet")&&mint)'
          replace(old,new,'afterbell star handoff')
          marker='  async enterTokenSystem(tokenPlanet:FieldParticle){'
          method='''  async enterWalletSystem(walletInput:string){const wallet=walletInput.trim(),valid=/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(wallet)||/^0x[a-fA-F0-9]{40}$/.test(wallet);if(!valid)return false;this.#stopVoice();this.#focusResolveSeq++;this.mode="explore";const label=`WALLET ${wallet.slice(0,5)}…${wallet.slice(-4)}`;this.fieldSection={kind:"trader-system",label,handle:wallet,wallet,count:0};this.dataStatus={store:"memory-fallback",coverage:"degraded",circuitBreaker:null,disclosure:"Reading retained chain-qualified token activity for this public wallet."};this.#emit();const data=await getWalletSystem({data:{wallet,limit:50}}) as WalletSystemResponse;if(this.#destroyed||this.fieldSection.kind!=="trader-system"||this.fieldSection.handle!==wallet)return false;if(!data.ok||!data.index){const disclosure="Wallet activity is unavailable from the retained evidence index. No token planets or performance values were invented.";this.dataStatus={store:"memory-fallback",coverage:"degraded",circuitBreaker:null,disclosure};this.narrateObserved(disclosure);this.#emit();return false;}const snapshot=buildWalletSystemSnapshot(data.index,this.galaxy.id);this.field.setSnapshot(snapshot);this.field.cameraState={yaw:.24,pitch:.13,distance:104,target:[0,9,0]};this.replay=createReplayState(snapshot);this.focus=null;this.evidence=null;this.askPrefill=wallet;this.fieldSection={kind:"trader-system",label,handle:wallet,wallet,count:data.index.tokens.length};this.dataStatus={store:"d1",coverage:data.index.tokens.length?"fresh":"empty",circuitBreaker:null,disclosure:data.index.disclosure};this.#emit();this.narrateObserved(`${label}. ${data.index.tokens.length} chain-qualified token planet${data.index.tokens.length===1?"":"s"} are present in retained evidence. Missing activity is unavailable, not zero, and no identity claim is made.`);return true;}\n'''
          replace(marker,method+marker,'wallet system method')
          replace('async returnToField(){','async returnToField(rehydrate=true){','return-to-field signature')
          replace('this.#emit();void this.#hydrateGalaxy(this.galaxy.id);}\n  setMuted','this.#emit();if(rehydrate)void this.#hydrateGalaxy(this.galaxy.id);}\n  setMuted','return-to-field hydrate gate')
          old_submit='''  async submitQuery(value:string){const query=value.trim();if(!query)return;unlockSpeech();this.#stopVoice();if(!this.queryActive||!this.organism)await this.enterQuery();const seq=++this.#querySeq;this.result=null;this.organismState="listening";this.organism?.setState("listening");this.#emit();await wait(280);if(seq!==this.#querySeq)return;this.organismState="analyzing";this.organism?.setState("analyzing");this.#emit();const result=await resolvePublicIdentifier({data:{query}});if(seq!==this.#querySeq)return;this.result=result;this.organismState="speaking";this.organism?.setState("speaking");this.#emit();this.#voice=speakText(result.spokenText,{muted:this.muted,volume:this.volume,onStart:()=>this.#pulseSpeech(true),onBoundary:()=>this.organism?.setSpeech(.34),onEnergy:e=>this.organism?.setSpeech(e),onEnd:()=>{this.#pulseSpeech(false);this.organism?.setSpeech(0);if(seq!==this.#querySeq)return;this.organismState="complete";this.organism?.setState("complete");this.#voice=null;this.#emit();}});if(this.muted){this.organismState="complete";this.organism?.setState("complete");this.#emit();}}'''
          new_submit='''  async submitQuery(value:string){const query=value.trim();if(!query)return;unlockSpeech();this.#stopVoice();if(!this.queryActive||!this.organism)await this.enterQuery();const seq=++this.#querySeq;this.result=null;this.organismState="listening";this.organism?.setState("listening");this.#emit();await wait(280);if(seq!==this.#querySeq)return;this.organismState="analyzing";this.organism?.setState("analyzing");this.#emit();const result=await resolvePublicIdentifier({data:{query}});if(seq!==this.#querySeq)return;const addressLike=/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(query)||/^0x[a-fA-F0-9]{40}$/.test(query);if(addressLike&&(result.kind==="wallet"||result.kind==="unknown")){await this.returnToField(false);await this.enterWalletSystem(query);return;}this.result=result;this.organismState="speaking";this.organism?.setState("speaking");this.#emit();this.#voice=speakText(result.spokenText,{muted:this.muted,volume:this.volume,onStart:()=>this.#pulseSpeech(true),onBoundary:()=>this.organism?.setSpeech(.34),onEnergy:e=>this.organism?.setSpeech(e),onEnd:()=>{this.#pulseSpeech(false);this.organism?.setSpeech(0);if(seq!==this.#querySeq)return;this.organismState="complete";this.organism?.setState("complete");this.#voice=null;this.#emit();}});if(this.muted){this.organismState="complete";this.organism?.setState("complete");this.#emit();}}'''
          replace(old_submit,new_submit,'wallet ASK routing')
          p.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/field/field-os.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: open wallet stars from Afterbell and ASK"
          git push origin HEAD:feat/afterbell-top50-wallet-query
