name: Main release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: verify + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # package-lock.json is currently out of sync with npm 10 / Node 22
      # (missing nested peer lru-cache@11.5.2). Prefer npm ci once lock is regenerated.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Verify release baseline
        run: npm run verify:release

      - name: Typecheck
        run: npm run typecheck

      - name: All repository tests
        run: npm test

      - name: Production frontend build
        env:
          CF_DEPLOY: "1"
        run: npm run build

      - name: Intelligence worker bundle
        run: npx wrangler deploy --dry-run --config workers/wrangler.production.toml

      - name: Frontend worker bundle from production build
        run: |
          test -f .wrangler/deploy/config.json
          npx wrangler deploy --dry-run --config .wrangler/deploy/config.json

      - name: Preserve tested frontend release
        uses: actions/upload-artifact@v4
        with:
          name: tested-frontend-${{ github.sha }}
          path: |
            .output
            .wrangler
            public/release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
