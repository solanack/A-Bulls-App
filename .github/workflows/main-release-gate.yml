name: Main release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: verify + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # package-lock.json is currently out of sync with npm 10 / Node 22
      # (missing nested peer lru-cache@11.5.2). Prefer npm ci once lock is regenerated.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Require Cloudflare release credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is unavailable to the release gate"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is unavailable to the release gate"; exit 1; }

      - name: Verify production provider secret coverage
        run: |
          npx wrangler secret list --config workers/wrangler.production.toml --format json > configured-provider-secrets.json
          node scripts/check-provider-secrets.mjs --configured-file configured-provider-secrets.json

      - name: Verify release baseline
        run: npm run verify:release

      - name: Typecheck
        run: npm run typecheck

      - name: All repository tests
        run: npm test

      - name: Production frontend build
        env:
          CF_DEPLOY: "1"
        run: npm run build

      - name: Intelligence worker bundle
        run: npx wrangler deploy --dry-run --config workers/wrangler.production.toml

      - name: Enforce expand-first Intelligence migrations
        run: node scripts/check-worker-migrations.mjs

      - name: Frontend worker bundle from production build
        run: |
          test -f .wrangler/deploy/config.json
          npx wrangler deploy --dry-run

      - name: Preserve tested frontend release
        id: frontend-artifact
        run: |
          test -f dist/server/wrangler.json
          find dist .wrangler public/release.json -type f -print0 | sort -z | xargs -0 sha256sum > release-artifact.sha256
          test -s release-artifact.sha256

      - name: Upload tested frontend release
        uses: actions/upload-artifact@v4
        with:
          name: tested-frontend-${{ github.sha }}
          path: |
            dist
            .wrangler
            public/release.json
            release-artifact.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
