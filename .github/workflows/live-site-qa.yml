name: Live Site QA

on:
  pull_request:
    branches:
      - main

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Run live QA
        run: |
          cat > live-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = 'https://www.abullsapp.com';
          const worker = 'https://black-bull-run-sol.ckdsigns1.workers.dev';
          const testWallet = '95DemfJx5nHkuQmLyKhCjaJ5iZERHFfQH8Lu4UorEqWS';
          const report = { base, worker, startedAt: new Date().toISOString(), checks: [], consoleErrors: [], pageErrors: [], failedRequests: [] };
          const check = (name, ok, detail='') => {
            report.checks.push({ name, ok: Boolean(ok), detail: String(detail || '') });
            console.log(`${ok ? 'PASS' : 'FAIL'} :: ${name}${detail ? ' :: ' + detail : ''}`);
          };
          const statusOk = r => r && r.status() >= 200 && r.status() < 400;

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, userAgent: 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/151 Mobile Safari/537.36 A-Bulls-QA' });
          const page = await context.newPage();
          page.on('console', msg => { if (msg.type() === 'error') report.consoleErrors.push(msg.text()); });
          page.on('pageerror', err => report.pageErrors.push(err.message));
          page.on('requestfailed', req => report.failedRequests.push({ url: req.url(), error: req.failure()?.errorText || 'failed' }));

          const routeClick = async (selector, activeView) => {
            const found = await page.locator(selector).count();
            if (!found) return false;
            await page.evaluate(sel => document.querySelector(sel)?.click(), selector);
            await page.waitForTimeout(250);
            return await page.locator(activeView + '.active').count() === 1;
          };

          try {
            const response = await page.goto(base, { waitUntil: 'networkidle', timeout: 60000 });
            check('Homepage HTTP success', statusOk(response), response ? `status ${response.status()}` : 'no response');
            check('Public domain is not behind Cloudflare Access', !page.url().includes('cloudflareaccess.com'), page.url());
            check('Canonical host is www.abullsapp.com', new URL(page.url()).hostname === 'www.abullsapp.com', page.url());
            const title = await page.title();
            check('Page title loaded', title === 'A Bulls App', title);
            const html = await page.content();
            check('Pages 8.4.0 marker', html.includes('8.4.0'));
            check('Home view present', !!(await page.$('#homeView')));
            check('Analytics view present', !!(await page.$('#trackView')));
            check('LIFE view present', !!(await page.$('#lifeView')));
            check('Profile view present', !!(await page.$('#profileView')));
            check('Settings view present', !!(await page.$('#settingsView')));
            check('Help view present', !!(await page.$('#helpView')));
            check('Bull Invaders game view present', !!(await page.$('#invadersGameView')));
            check('Bull Invaders canvas present', !!(await page.$('#invadersCanvas')));
            check('Leaderboard view present', !!(await page.$('#invaderLeaderboardView')));
            check('Stats view present', !!(await page.$('#invaderStatsView')));

            for (const [name, path] of [
              ['Service worker','/sw.js?v=8.4.0'],
              ['Manifest','/manifest.webmanifest'],
              ['Privacy','/privacy.html'],
              ['Terms','/terms.html'],
              ['Opening video','/assets/opening/opening-sequence.mp4'],
              ['Pixi','/vendor/pixi-8.19.0.min.js'],
              ['Bull Invaders JS','/js/bull-invaders.js?v=8.4.0'],
              ['LIFE JS','/js/life.js?v=8.4.0']
            ]) {
              const r = await page.request.get(base + path, { headers: path.endsWith('.mp4') ? { Range: 'bytes=0-1023' } : {} });
              check(`${name} reachable`, statusOk(r), `status ${r.status()}`);
            }

            check('LIFE navigation works', await routeClick('[data-view="life"]', '#lifeView'));
            check('Analytics navigation works', await routeClick('[data-view="intelligence"]', '#trackView'));
            check('Profile navigation works', await routeClick('[data-view="profile"]', '#profileView'));
            check('Settings navigation works', await routeClick('[data-view="settings"]', '#settingsView'));
            check('Help navigation works', await routeClick('[data-view="help"]', '#helpView'));

            const health = await page.request.get(worker + '/api/health', { headers: { Origin: base } });
            const healthText = await health.text();
            let healthJson = null;
            try { healthJson = JSON.parse(healthText); } catch {}
            check('Worker health HTTP success', health.status() === 200, `status ${health.status()}`);
            check('Worker reports 8.0.4', healthJson?.data?.version === '8.0.4', healthJson?.data?.version || healthText.slice(0,120));
            check('Worker version header present', health.headers()['x-worker-version'] === '8.0.4', health.headers()['x-worker-version'] || 'missing');
            check('Worker Server-Timing present', !!health.headers()['server-timing'], health.headers()['server-timing'] || 'missing');
            check('Worker shared analytics cache bound', healthJson?.data?.services?.sharedAnalyticsCache === true, String(healthJson?.data?.services?.sharedAnalyticsCache));
            check('Worker leaderboard bound', healthJson?.data?.services?.leaderboard === true, String(healthJson?.data?.services?.leaderboard));
            check('Worker wallet analytics enabled', healthJson?.data?.services?.walletAnalytics === true, String(healthJson?.data?.services?.walletAnalytics));

            for (const [name, path] of [
              ['NFT collection stats','/api/nft/collection-stats'],
              ['NFT ecosystem stats','/api/nft/ecosystem-stats'],
              ['ANSEM analytics','/api/ansem/analytics'],
              ['Leaderboard top','/api/leaderboard/top?game=bull-invaders&limit=5']
            ]) {
              const r = await page.request.get(worker + path, { headers: { Origin: base } });
              check(`${name} endpoint`, r.status() === 200, `status ${r.status()}`);
            }

            const overview = await page.request.post(worker + '/api/wallet/overview', { headers: { Origin: base, 'Content-Type': 'application/json' }, data: { address: testWallet } });
            check('Wallet overview endpoint', overview.status() === 200, `status ${overview.status()}`);
            const activity = await page.request.post(worker + '/api/wallet/activity', { headers: { Origin: base, 'Content-Type': 'application/json' }, data: { address: testWallet, range: '30d', limit: 25 } });
            check('Wallet activity endpoint', activity.status() === 200, `status ${activity.status()}`);

            await page.evaluate(({ wallet }) => {
              document.querySelector('[data-view="life"]')?.click();
              const input = document.querySelector('#lifeWalletInput');
              if (input) { input.value = wallet; input.dispatchEvent(new Event('input', { bubbles: true })); }
            }, { wallet: testWallet });
            await page.locator('#lifeAnalyze').click({ force: true });
            await page.waitForTimeout(2500);
            const lifeText = (await page.locator('#lifeQuestions').innerText().catch(() => '')).trim();
            check('LIFE produces reflection output', lifeText.length > 40 && !/No wallet activity has been analyzed yet/i.test(lifeText), lifeText.slice(0,120));
            check('LIFE output stays question-oriented', lifeText.includes('?'), lifeText.slice(0,120));

            const assetUrls = await page.evaluate(() => [...document.querySelectorAll('script[src],link[href],img[src]')].map(el => el.src || el.href).filter(Boolean));
            const uniqueAssets = [...new Set(assetUrls)].filter(u => u.startsWith(location.origin)).slice(0, 100);
            const badAssets = [];
            for (const u of uniqueAssets) {
              const r = await page.request.get(u);
              if (r.status() >= 400) badAssets.push({ url: u, status: r.status() });
            }
            check('Loaded first-party assets healthy', badAssets.length === 0, badAssets.length ? JSON.stringify(badAssets.slice(0,8)) : `${uniqueAssets.length} checked`);

            await page.evaluate(() => document.querySelector('[data-view="home"]')?.click());
            await page.waitForTimeout(250);
            await page.screenshot({ path: 'live-home-mobile.png', fullPage: true });
            await page.evaluate(() => document.querySelector('[data-view="life"]')?.click());
            await page.waitForTimeout(250);
            await page.screenshot({ path: 'live-life-mobile.png', fullPage: true });
          } catch (err) {
            check('QA runner completed all scripted checks', false, err.stack || err.message);
          }

          const filteredConsoleErrors = report.consoleErrors.filter(e => !e.includes('accounts.google.com/gsi/client'));
          const seriousFailedRequests = report.failedRequests.filter(e => !e.url.includes('accounts.google.com/gsi/client'));
          check('No page runtime exceptions', report.pageErrors.length === 0, `${report.pageErrors.length} page errors`);
          check('No unexpected failed requests', seriousFailedRequests.length === 0, seriousFailedRequests.slice(0,6).map(x => `${x.url} (${x.error})`).join('; '));
          check('No unexpected console errors', filteredConsoleErrors.length === 0, filteredConsoleErrors.slice(0,6).join('; '));

          report.finishedAt = new Date().toISOString();
          report.filteredConsoleErrors = filteredConsoleErrors;
          report.seriousFailedRequests = seriousFailedRequests;
          report.pass = report.checks.every(c => c.ok);
          fs.writeFileSync('live-qa-report.json', JSON.stringify(report, null, 2));
          await browser.close();
          if (!report.pass) process.exitCode = 1;
          EOF
          node live-qa.mjs

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-qa
          path: |
            live-qa-report.json
            live-home-mobile.png
            live-life-mobile.png
