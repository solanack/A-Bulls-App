name: Universe and Trickster CI

on:
  push:
    branches: [ feature/universe-trickster-v1 ]
    paths:
      - 'js/universe-*.mjs'
      - 'js/trickster-*.mjs'
      - 'js/temporal-*.mjs'
      - 'js/trade-*.mjs'
      - 'js/product-*.mjs'
      - 'js/experience-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-experience-vendor.mjs'
      - 'js/evidence-state*.mjs'
      - 'js/config.js'
      - 'js/main.js'
      - 'js/ui.js'
      - 'js/bull-vision.js'
      - 'workers/intelligence-universe-*.mjs'
      - 'workers/intelligence-trickster-*.mjs'
      - 'workers/intelligence-worker-hooks.mjs'
      - 'workers/migrations/0011_universe_trickster.sql'
      - 'docs/UNIVERSE-TRICKSTER-V1.md'
      - 'docs/PRODUCT-SHELL-VNEXT.md'
      - 'css/product-shell-vnext.css'
      - 'css/universe.css'
      - 'css/trickster-studio.css'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/universe-trickster-ci.yml'
  pull_request:
    paths:
      - 'js/universe-*.mjs'
      - 'js/trickster-*.mjs'
      - 'js/temporal-*.mjs'
      - 'js/trade-*.mjs'
      - 'js/product-*.mjs'
      - 'js/experience-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-experience-vendor.mjs'
      - 'js/evidence-state*.mjs'
      - 'js/config.js'
      - 'workers/intelligence-universe-*.mjs'
      - 'workers/intelligence-trickster-*.mjs'
      - 'workers/intelligence-worker-hooks.mjs'
      - 'workers/migrations/0011_universe_trickster.sql'
      - 'docs/UNIVERSE-TRICKSTER-V1.md'
      - 'docs/PRODUCT-SHELL-VNEXT.md'
      - 'css/product-shell-vnext.css'
      - 'css/universe.css'
      - 'css/trickster-studio.css'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/universe-trickster-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build pinned browser dependencies
        run: |
          npm ci --ignore-scripts
          npm run build:experience-vendor
          echo '86bcee248b64f44bcfc23c331ae74619061957d59cab040171dcb6fb5900beb6  vendor/experience/three-0.185.0.module.min.js' | sha256sum --check -
          echo '0ffdb882fab437f402a9a4d95a1aa854bedfa061c6d08684c1a702ddd6ad8029  vendor/experience/mediabunny-1.55.2.min.mjs' | sha256sum --check -
      - name: Syntax
        run: |
          for file in \
            js/universe-contracts.mjs \
            js/universe-quality.mjs \
            js/universe-synthetic-data.mjs \
            js/universe-transition.mjs \
            js/universe-renderer.mjs \
            js/universe-client.mjs \
            js/universe-experience.mjs \
            js/trickster-story-manifest.mjs \
            js/trickster-composer.mjs \
            js/trickster-export-capabilities.mjs \
            js/trickster-timeline.mjs \
            js/trickster-clip-export.mjs \
            js/trickster-validation-client.mjs \
            js/trickster-studio.mjs \
            js/temporal-replay-engine.mjs \
            js/trade-comparison-replay.mjs \
            js/trade-replay-player.mjs \
            js/product-registry.mjs \
            js/product-shell-vnext.mjs \
            js/product-adapters.mjs \
            js/universal-search.mjs \
            js/experience-bootstrap.mjs \
            js/experience-entry.mjs \
            js/experience-feature-flags.mjs \
            js/experience-dependencies.mjs \
            js/evidence-state.mjs \
            js/config.js \
            js/main.js \
            js/ui.js \
            js/bull-vision.js \
            sw.js \
            workers/intelligence-universe-runtime.mjs \
            workers/intelligence-universe-router.mjs \
            workers/intelligence-trickster-router.mjs \
            workers/intelligence-worker-hooks.mjs
          do
            node --check "$file"
          done
      - name: Contract tests
        run: |
          node --test \
            js/universe-contracts.test.mjs \
            js/universe-runtime.test.mjs \
            js/universe-client.test.mjs \
            js/trickster-story-manifest.test.mjs \
            js/trickster-runtime.test.mjs \
            js/trickster-timeline.test.mjs \
            js/trickster-validation-client.test.mjs \
            js/temporal-replay-engine.test.mjs \
            js/trade-comparison-replay.test.mjs \
            js/experience-feature-flags.test.mjs \
            js/experience-dependencies.test.mjs \
            js/experience-integration.test.mjs \
            js/product-shell.test.mjs \
            js/product-integration.test.mjs \
            js/evidence-state.test.mjs \
            workers/intelligence-universe-runtime.test.mjs \
            workers/intelligence-trickster-router.test.mjs
      - name: Preservation guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq 'sendTransaction|signTransaction|secretKey|seed phrase|private[_ -]?key' js/universe-*.mjs js/trickster-*.mjs js/temporal-*.mjs js/trade-*.mjs
          grep -q 'Disabled by default' docs/UNIVERSE-TRICKSTER-V1.md
          grep -q 'CREATE TABLE IF NOT EXISTS intelligence_live_observations' workers/migrations/0011_universe_trickster.sql
          grep -q 'CREATE TABLE IF NOT EXISTS intelligence_story_manifests' workers/migrations/0011_universe_trickster.sql
          ! grep -Eiq 'DROP[[:space:]]+TABLE|TRUNCATE' workers/migrations/0011_universe_trickster.sql
          grep -q 'nextProductShellEnabled: false' js/config.js
          grep -q 'universeEnabled: false' js/config.js
          grep -q 'tricksterStudioEnabled: false' js/config.js
          grep -q 'persisted:false' workers/intelligence-trickster-router.mjs
          grep -q 'validateStoryForExport' js/experience-entry.mjs
          ! grep -Eiq 'BBRLife|lifeView|js/life\.js|id:[[:space:]]*['"'"'"]life['"'"'"]' index.html js/main.js js/ui.js js/product-registry.mjs sw.js
