name: Universe and Trickster CI

on:
  pull_request:
  push:
    branches: [ feature/universe-trickster-v1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build browser dependencies
        run: |
          npm ci --ignore-scripts
          npm run build:experience-vendor
      - name: vNext syntax
        run: |
          set -euo pipefail
          for file in js/universe-*.mjs js/trickster-*.mjs js/temporal-*.mjs js/trade-*.mjs js/replay-*.mjs js/market-context-*.mjs js/event-story-*.mjs js/product-*.mjs js/experience-*.mjs js/intelligence-workspace-*.mjs js/intelligence-event-ledger.mjs js/event-market-context-client.mjs js/entity-resolver-client.mjs js/wallet-token-index-client.mjs js/bull-invaders-host.mjs js/evidence-state.mjs js/universal-search.mjs workers/intelligence-universe-*.mjs workers/intelligence-trickster-*.mjs workers/intelligence-replay-*.mjs workers/intelligence-event-context.mjs workers/intelligence-entity-resolver.mjs workers/intelligence-wallet-token-index.mjs workers/intelligence-worker-hooks.mjs; do
            [ -e "$file" ] && node --check "$file"
          done
          node --check js/config.js
          node --check js/main.js
          node --check sw.js
      - name: vNext tests
        run: |
          node --test \
            js/universe-contracts.test.mjs \
            js/universe-runtime.test.mjs \
            js/universe-client.test.mjs \
            js/trickster-story-manifest.test.mjs \
            js/trickster-runtime.test.mjs \
            js/trickster-timeline.test.mjs \
            js/trickster-validation-client.test.mjs \
            js/temporal-replay-engine.test.mjs \
            js/trade-comparison-replay.test.mjs \
            js/trade-replay-player.test.mjs \
            js/market-context-replay.test.mjs \
            js/market-context-player-bridge.test.mjs \
            js/event-story-director.test.mjs \
            js/event-story-price-selection.test.mjs \
            js/event-story-focus.test.mjs \
            js/event-story-scene-runtime.test.mjs \
            js/event-story-scene-slice.test.mjs \
            js/intelligence-event-ledger.test.mjs \
            js/universal-search.test.mjs \
            js/experience-feature-flags.test.mjs \
            js/experience-dependencies.test.mjs \
            js/experience-integration.test.mjs \
            js/product-shell.test.mjs \
            js/product-integration.test.mjs \
            js/evidence-state.test.mjs \
            workers/intelligence-entity-resolver.test.mjs \
            workers/intelligence-wallet-token-index.test.mjs \
            workers/intelligence-event-context.test.mjs \
            workers/intelligence-universe-runtime.test.mjs \
            workers/intelligence-trickster-router.test.mjs \
            workers/intelligence-replay-bundle.test.mjs
      - name: Responsive replacement contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'nextProductShellEnabled: true' js/config.js
          grep -q 'createBullInvadersHost' js/experience-entry.mjs
          grep -q 'applyExplicitEventStoryPriceSelection' js/experience-entry.mjs
          grep -q 'bull-invaders-vnext.css' index.html
          grep -q 'market-context-player-bridge.mjs' index.html
          grep -q '@media(max-width:760px)' css/product-shell-vnext.css
          grep -q '@media(max-width:760px)' css/bull-invaders-vnext.css
          grep -q '@media(max-width:760px)' css/intelligence-workspace-vnext.css
          grep -q '@media(max-width:760px)' css/intelligence-event-inspector.css
          grep -q '/api/intelligence/replay-bundle' workers/intelligence-replay-bundle.mjs
          grep -q '/api/intelligence/event-context' workers/intelligence-event-context.mjs
          grep -q '/api/intelligence/resolve' workers/intelligence-entity-resolver.mjs
          grep -q '/api/intelligence/wallet-tokens' workers/intelligence-wallet-token-index.mjs
          grep -q 'handleEventMarketContextRequest' workers/intelligence-worker-hooks.mjs
          grep -q 'handleWalletTokenIndexRequest' workers/intelligence-worker-hooks.mjs
          grep -q 'EventMarketContextClient' js/intelligence-event-ledger.mjs
          grep -q 'abulls:event-market-context' js/event-market-context-client.mjs
          grep -q 'PLAY MARKET WINDOW' js/market-context-player-bridge.mjs
          grep -q 'STORY + REPLAY PRICE EVIDENCE' js/market-context-player-bridge.mjs
          grep -q 'Story pricing: TIME-ONLY' js/market-context-player-bridge.mjs
          grep -q 'selectedPricePair' js/market-context-player-bridge.mjs
          grep -q 'buildMarketContextReplay' js/market-context-player-bridge.mjs
          grep -q 'what-happened-next' js/event-story-director.mjs
          grep -q 'priceSelection' js/event-story-price-selection.mjs
          grep -q 'resolveEventStoryFocus' js/trickster-studio.mjs
          grep -q 'buildEventStorySceneRuntime' js/trickster-studio.mjs
          grep -q 'buildEventStorySceneSlice' js/trickster-studio.mjs
          grep -q 'sceneRuntime' js/trickster-studio.mjs
          grep -q 'trickster-scene-evidence' js/trickster-studio.mjs
          grep -q 'TIME-ONLY · NO PRICE MARKET SELECTED' js/trickster-studio.mjs
          grep -q 'PRICE OVERLAY ·' js/trickster-studio.mjs
          grep -q 'createEvidenceLedger' js/intelligence-workspace-vnext.mjs
          grep -q 'focusReplayEvent' js/trade-replay-player.mjs
          grep -q 'TIME-ONLY EVENT LANE' js/trade-replay-player.mjs
          grep -q 'DIRECT EXECUTION EVIDENCE' js/intelligence-event-ledger.mjs
          grep -q 'MARKET CONTEXT · INDEXED WINDOW' js/intelligence-event-ledger.mjs
          grep -q 'CREATE EVENT STORY' js/intelligence-event-ledger.mjs
          grep -q "storyType:'transaction-replay'" js/intelligence-event-ledger.mjs
          grep -q 'bundle?.replay?.events' js/trickster-studio.mjs
          grep -q 'event-story-director' sw.js
          grep -q 'event-story-price-selection' sw.js
          grep -q 'event-story-focus' sw.js
          grep -q 'event-story-scene-runtime' sw.js
          grep -q 'event-story-scene-slice' sw.js
          grep -q 'market-context-player-bridge' sw.js
          grep -q 'event-market-context-client' sw.js
          grep -q 'Around transaction (12h)' js/intelligence-workspace-vnext.mjs
          grep -q "adapters.activate('intelligence', { source: 'universal-search', request })" js/experience-bootstrap.mjs
          test ! -d games
          test ! -e js/ui.js
          test ! -e js/track.js
          test ! -e js/bull-intelligence.js
          test ! -e js/bull-vision.js
          ! grep -Eiq 'Ansem|Bullpen|ansem\.io|community-integrations|Solana Bang Bang' index.html js/config.js js/product-registry.mjs js/experience-entry.mjs js/intelligence-workspace-vnext.mjs sw.js
