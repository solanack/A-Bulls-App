name: Universe and Trickster CI

on:
  push:
    branches: [ feature/universe-trickster-v1 ]
    paths:
      - 'js/universe-*.mjs'
      - 'js/trickster-*.mjs'
      - 'js/experience-feature-flags*.mjs'
      - 'docs/UNIVERSE-TRICKSTER-V1.md'
      - 'docs/PRODUCT-SHELL-VNEXT.md'
      - 'css/product-shell-vnext.css'
      - 'js/product-*.mjs'
      - '.github/workflows/universe-trickster-ci.yml'
  pull_request:
    paths:
      - 'js/universe-*.mjs'
      - 'js/trickster-*.mjs'
      - 'js/experience-feature-flags*.mjs'
      - 'docs/UNIVERSE-TRICKSTER-V1.md'
      - '.github/workflows/universe-trickster-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check js/universe-contracts.mjs
          node --check js/trickster-story-manifest.mjs
          node --check js/experience-feature-flags.mjs
          node --check js/universe-quality.mjs
          node --check js/universe-synthetic-data.mjs
          node --check js/universe-transition.mjs
          node --check js/universe-renderer.mjs
          node --check js/trickster-composer.mjs
          node --check js/trickster-export-capabilities.mjs
          node --check js/product-registry.mjs
          node --check js/product-shell-vnext.mjs
          node --check js/product-adapters.mjs
          node --check js/universal-search.mjs
          node --check js/experience-bootstrap.mjs
      - name: Contract tests
        run: node --test js/universe-contracts.test.mjs js/universe-runtime.test.mjs js/trickster-story-manifest.test.mjs js/trickster-runtime.test.mjs js/experience-feature-flags.test.mjs js/product-shell.test.mjs js/product-integration.test.mjs
      - name: Preservation guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq 'sendTransaction|signTransaction|secretKey|seed phrase|private[_ -]?key' js/universe-*.mjs js/trickster-*.mjs
          grep -q 'Disabled by default' docs/UNIVERSE-TRICKSTER-V1.md
