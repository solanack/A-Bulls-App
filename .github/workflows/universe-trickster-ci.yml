name: Universe and Trickster CI

on:
  pull_request:
    types: [ready_for_review, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build browser dependencies
        run: npm run build:experience-vendor

      - name: Reconstruct verified Worker 8.2.0 baseline
        run: npm run build:worker-baseline

      - name: Syntax check application and worker modules
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.mjs workers/*.mjs services/intelligence-bridge/*.mjs; do
            [ -e "$file" ] && node --check "$file"
          done
          node --check js/config.js
          node --check js/main.js
          node --check sw.js

      - name: Run complete unit and compatibility suite
        shell: bash
        run: |
          set -euo pipefail
          node --test js/*.test.mjs workers/*.test.mjs services/intelligence-bridge/*.test.mjs tests/*.test.mjs

      - name: Release architecture guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'nextProductShellEnabled: true' js/config.js
          grep -q 'universeEnabled: true' js/config.js
          grep -q 'tricksterStudioEnabled: true' js/config.js
          grep -q 'experience-entry.mjs?v=8' index.html
          grep -q 'TOKEN MARKET' js/experience-entry.mjs
          grep -q 'Bull Invaders' js/experience-entry.mjs
          grep -q 'NO INDEXED EVIDENCE' js/token-market-workspace.mjs
          grep -q 'SKIP INACTIVITY' js/trade-replay-player.mjs
          grep -q 'PLAY PHASE' js/market-sequence-phase-controls.mjs
          grep -q 'CREATE PHASE STORY' js/market-sequence-phase-controls.mjs
          grep -q 'PLAY STORY IN FIELD' js/trickster-field-playback.mjs
          grep -q 'field-entity-focus' sw.js
          grep -q 'field-story-scene' sw.js
          grep -q 'trickster-field-playback' sw.js
          grep -q 'field-investigation-hub' sw.js
          grep -q 'field-evidence-scope' sw.js
          grep -q 'guardIntelligenceRequest' workers/worker-vnext-entry.mjs
          grep -q 'fieldCommandRequest' js/experience-bootstrap.mjs
          grep -q 'universeObservationsForEvents' workers/intelligence-mesh-ingest.mjs
          grep -q "const BUILD='8.7.0-vnext-69'" sw.js
          grep -q 'worker-vnext-entry.mjs' workers/wrangler.toml
          grep -q 'reconstruct-worker-8.2.0.mjs' workers/wrangler.toml
          test ! -d games
          test ! -e js/ui.js
          test ! -e js/track.js
          test ! -e js/bull-intelligence.js
          test ! -e js/bull-vision.js

      - name: Retired product and wallet-safety guards
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq 'Ansem|Bullpen|ansem\.io|community-integrations|Solana Bang Bang|Claude of Duty|BBRLife|lifeView' \
            index.html js/config.js js/product-registry.mjs js/experience-entry.mjs js/intelligence-workspace-vnext.mjs js/token-market-workspace.mjs sw.js workers/wrangler.toml workers/worker-vnext-entry.mjs
          ! grep -Eiq 'seed phrase|private key import|signTransaction|sendTransaction|secretKey' \
            workers/intelligence-*.mjs js/intelligence-workspace-*.mjs js/token-market-workspace.mjs js/replay-*.mjs js/trade-*.mjs js/temporal-*.mjs

      - name: Cloudflare release config guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://abullsapp.com' workers/wrangler.toml
          grep -q 'https://www.abullsapp.com' workers/wrangler.toml
          grep -q '\[observability\]' workers/wrangler.toml
          grep -q 'compatibility_date = "2026-08-01"' workers/wrangler.toml
          test -f privacy.html
          test -f terms.html
          test -f manifest.webmanifest
          test -f _headers
          ! grep -Eiq '<html|<!doctype' _headers
          grep -q 'X-Content-Type-Options: nosniff' _headers
