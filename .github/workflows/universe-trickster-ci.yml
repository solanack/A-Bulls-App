name: Universe and Trickster CI

on:
  pull_request:
  push:
    branches: [ feature/universe-trickster-v1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build browser dependencies
        run: |
          npm ci --ignore-scripts
          npm run build:experience-vendor
      - name: vNext syntax
        run: |
          set -euo pipefail
          for file in js/universe-*.mjs js/trickster-*.mjs js/temporal-*.mjs js/trade-*.mjs js/replay-*.mjs js/market-context-*.mjs js/event-story-*.mjs js/wallet-comparison-*.mjs js/product-*.mjs js/experience-*.mjs js/intelligence-workspace-*.mjs js/intelligence-event-ledger.mjs js/event-market-context-client.mjs js/entity-resolver-client.mjs js/wallet-token-index-client.mjs js/bull-invaders-host.mjs js/evidence-state.mjs js/universal-search.mjs workers/intelligence-universe-*.mjs workers/intelligence-trickster-*.mjs workers/intelligence-replay-*.mjs workers/intelligence-event-context.mjs workers/intelligence-entity-resolver.mjs workers/intelligence-wallet-token-index.mjs workers/intelligence-worker-hooks.mjs; do
            [ -e "$file" ] && node --check "$file"
          done
          node --check js/config.js
          node --check js/main.js
          node --check sw.js
      - name: vNext tests
        run: |
          node --test \
            js/universe-contracts.test.mjs \
            js/universe-runtime.test.mjs \
            js/universe-client.test.mjs \
            js/trickster-story-manifest.test.mjs \
            js/trickster-runtime.test.mjs \
            js/trickster-timeline.test.mjs \
            js/trickster-caption-plan.test.mjs \
            js/trickster-caption-renderer.test.mjs \
            js/trickster-validation-client.test.mjs \
            js/trickster-video-delivery.test.mjs \
            js/temporal-replay-engine.test.mjs \
            js/trade-comparison-replay.test.mjs \
            js/trade-replay-player.test.mjs \
            js/market-context-replay.test.mjs \
            js/market-context-player-bridge.test.mjs \
            js/event-story-director.test.mjs \
            js/event-story-price-selection.test.mjs \
            js/event-story-focus.test.mjs \
            js/event-story-scene-runtime.test.mjs \
            js/event-story-scene-slice.test.mjs \
            js/event-story-render-plan.test.mjs \
            js/event-story-scene-transition.test.mjs \
            js/event-story-frame-model.test.mjs \
            js/event-story-frame-renderer.test.mjs \
            js/event-story-frame-drawer.test.mjs \
            js/event-story-video-export.test.mjs \
            js/wallet-comparison-story-runtime.test.mjs \
            js/wallet-comparison-render-plan.test.mjs \
            js/wallet-comparison-frame-model.test.mjs \
            js/wallet-comparison-frame-renderer.test.mjs \
            js/wallet-comparison-video-export.test.mjs \
            js/wallet-comparison-what-if.test.mjs \
            js/intelligence-event-ledger.test.mjs \
            js/universal-search.test.mjs \
            js/experience-feature-flags.test.mjs \
            js/experience-dependencies.test.mjs \
            js/experience-integration.test.mjs \
            js/product-shell.test.mjs \
            js/product-integration.test.mjs \
            js/evidence-state.test.mjs \
            workers/intelligence-entity-resolver.test.mjs \
            workers/intelligence-wallet-token-index.test.mjs \
            workers/intelligence-event-context.test.mjs \
            workers/intelligence-universe-runtime.test.mjs \
            workers/intelligence-trickster-router.test.mjs \
            workers/intelligence-replay-bundle.test.mjs
      - name: Responsive replacement contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'nextProductShellEnabled: true' js/config.js
          grep -q 'createBullInvadersHost' js/experience-entry.mjs
          grep -q 'applyExplicitEventStoryPriceSelection' js/experience-entry.mjs
          grep -q 'renderEventStoryVideo' js/experience-entry.mjs
          grep -q 'renderWalletComparisonVideo' js/experience-entry.mjs
          grep -q 'validateStoryForExport' js/experience-entry.mjs
          grep -q 'walletComparisonScenePlan' js/trickster-studio.mjs
          grep -q 'buildWalletComparisonStoryWhatIf' js/trickster-studio.mjs
          grep -q 'A TIMING → B' js/trickster-studio.mjs
          grep -q 'B TIMING → A' js/trickster-studio.mjs
          grep -q 'REMOVE WHAT IF' js/trickster-studio.mjs
          grep -q 'walletComparisonWhatIfClaim' js/wallet-comparison-what-if.mjs
          grep -q 'HYPOTHETICAL TARGET' js/wallet-comparison-frame-renderer.mjs
          grep -q 'OBSERVED SOURCE' js/wallet-comparison-frame-renderer.mjs
          grep -q 'buildTricksterCaptionPlan' js/event-story-frame-drawer.mjs
          grep -q 'drawTricksterCaption' js/event-story-frame-drawer.mjs
          grep -q 'buildTricksterCaptionPlan' js/wallet-comparison-frame-drawer.mjs
          grep -q 'drawTricksterCaption' js/wallet-comparison-frame-drawer.mjs
          grep -q 'OBSERVED ON CHAIN' js/trickster-caption-plan.mjs
          grep -q 'CALCULATED FROM EVIDENCE' js/trickster-caption-plan.mjs
          grep -q 'SIMULATION' js/trickster-caption-plan.mjs
          grep -q 'trickster-simulation.css' index.html
          grep -q '@media(max-width:760px)' css/trickster-simulation.css
          grep -q 'eventLightningState' js/event-story-frame-renderer.mjs
          grep -q 'SAVE VIDEO' js/trickster-video-delivery.mjs
          grep -q 'SERVER RENDER REQUIRED' js/trickster-video-delivery.mjs
          grep -q 'createEvidenceLedger' js/intelligence-workspace-vnext.mjs
          grep -q 'TIME-ONLY EVENT LANE' js/trade-replay-player.mjs
          grep -q 'CREATE EVENT STORY' js/intelligence-event-ledger.mjs
          grep -q 'trickster-caption-plan' sw.js
          grep -q 'trickster-caption-renderer' sw.js
          grep -q 'event-story-video-export' sw.js
          grep -q 'wallet-comparison-video-export' sw.js
          grep -q 'wallet-comparison-what-if' sw.js
          grep -q 'Around transaction (12h)' js/intelligence-workspace-vnext.mjs
          test ! -d games
          test ! -e js/ui.js
          test ! -e js/track.js
          test ! -e js/bull-intelligence.js
          test ! -e js/bull-vision.js
          ! grep -Eiq 'Ansem|Bullpen|ansem\.io|community-integrations|Solana Bang Bang' index.html js/config.js js/product-registry.mjs js/experience-entry.mjs js/intelligence-workspace-vnext.mjs sw.js
