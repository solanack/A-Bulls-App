name: Final Replay cinematic upgrade
on:
  push:
    paths:
      - '.github/workflows/replay-cinematic-release.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Replay upgrade
        run: python3 scripts/apply-hackathon-replay-upgrade.py
      - name: Verify complete repository
        run: |
          npm install --ignore-scripts
          npm run typecheck
          npm test
          npm run build
          test -f .vercel/output/static/afterbell/index.html
          grep -R -q 'AFTERBELL' .vercel/output/static/assets
      - name: Commit verified source upgrade
        run: |
          git config user.name "A Bulls Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add workers/intelligence-replay-bundle.mjs workers/intelligence-replay-bundle.test.mjs src/components/universe-workspace.tsx src/components/replay-workspace.tsx scripts/replay-cinematic-contract.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: make Replay pre-entry adaptive and cinematic"
          git push origin HEAD:main
