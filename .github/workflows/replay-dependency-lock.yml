name: Replay dependency lock

on:
  push:
    branches:
      - finish/replay-studio-and-data-plane-20260922
    paths:
      - .github/workflows/replay-dependency-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/replay-studio-and-data-plane-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked Replay Studio dependencies
        run: npm uninstall tone
          npm install --save-exact lightweight-charts@5.2.1 mediabunny@1.58.1
      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lock already current."
          else
            git commit -m "build: lock Replay Studio media dependencies"
            git push origin HEAD:finish/replay-studio-and-data-plane-20260922
          fi
