name: Sync exact Worker source

on:
  push:
    branches:
      - release/v8.6.1-intelligence
    paths:
      - '.worker-sync/manifest.txt'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v8.6.1-intelligence
      - name: Reconstruct Worker 8.1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workers
          cat .worker-sync/part-*.b64 | base64 -d | gzip -dc > workers/worker.js
          echo '704e86bec37c7b76544534785c2848f84b282ee79cee0d225e166eeaf879e32c  workers/worker.js' | sha256sum -c -
          node --check workers/worker.js
          grep -q "const VERSION = '8.1.1';" workers/worker.js
          grep -q "/api/intelligence/time-machine" workers/worker.js
          grep -q "/api/intelligence/radar" workers/worker.js
          grep -q "/api/intelligence/nft-memory" workers/worker.js
      - name: Commit reconstructed Worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/worker.js
          if git diff --cached --quiet; then
            echo 'Exact Worker source is already synchronized.'
            exit 0
          fi
          git commit -m 'chore: sync exact Worker 8.1.1 source'
          git push origin HEAD:release/v8.6.1-intelligence
