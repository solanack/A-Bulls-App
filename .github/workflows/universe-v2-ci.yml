name: Universe v2 CI

on:
  push:
    branches:
      - feature/ecosystem-universes-pattern-lab-v2
  pull_request:
    paths:
      - 'workers/**'
      - 'js/universe-*.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:universe-v2
      - run: npm run test:worker-compat
