name: Sync deployed A Bulls App source

# PR validation trigger for deterministic live-source rebuild.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sync-live-source.yml'
      - '.source-sync/pages-runtime-manifest.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download canonical runtime files
        env:
          SITE_ORIGIN: https://www.abullsapp.com
        run: |
          set -euo pipefail
          rm -rf site sync-log
          mkdir -p site sync-log
          cp .source-sync/pages-runtime-manifest.txt sync-log/manifest.txt

          python - <<'PY'
          from pathlib import Path
          paths=[]
          for line in Path('sync-log/manifest.txt').read_text().splitlines():
              path=line.strip()
              if path and not path.startswith('#'):
                  paths.append(path)
          Path('sync-log/paths.txt').write_text('\n'.join(paths)+'\n')
          print(f'{len(paths)} runtime paths queued')
          PY

          download_one() {
            path="$1"
            mkdir -p "site/$(dirname "$path")"
            if curl -fsSL --retry 2 --retry-delay 1 --connect-timeout 8 --max-time 35 \
              -H 'Cache-Control: no-cache' -A 'A-Bulls-App-Source-Sync/2.0' \
              "$SITE_ORIGIN/$path" -o "site/$path"; then
              printf 'OK\t%s\n' "$path" >> sync-log/results.tsv
            else
              rm -f "site/$path"
              printf 'MISS\t%s\n' "$path" >> sync-log/results.tsv
            fi
          }
          export -f download_one
          export SITE_ORIGIN
          : > sync-log/results.tsv
          xargs -r -P 12 -I{} bash -c 'download_one "$1"' _ {} < sync-log/paths.txt

          python - <<'PY'
          from pathlib import Path
          import re
          rows=Path('sync-log/results.tsv').read_text().splitlines()
          ok=[r.split('\t',1)[1] for r in rows if r.startswith('OK\t')]
          missing=[r.split('\t',1)[1] for r in rows if r.startswith('MISS\t')]
          index=Path('site/index.html').read_text('utf-8',errors='ignore') if Path('site/index.html').exists() else ''
          m=re.search(r'bbrs-build[^>]*content=["\']([^"\']+)', index)
          build=m.group(1) if m else 'unknown'
          report=[
            '# Live source sync','',
            '- Origin: https://www.abullsapp.com',
            f'- Build detected: {build}',
            f'- Runtime files downloaded: {len(ok)}',
            f'- Missing paths: {len(missing)}','',
            '## Missing paths',*(missing or ['None'])
          ]
          Path('site/SYNC_REPORT.md').write_text('\n'.join(report)+'\n')
          print(f'build={build} ok={len(ok)} missing={len(missing)}')
          if not Path('site/index.html').exists():
              raise SystemExit('index.html was not downloaded')
          PY

      - name: Publish source snapshot branch
        run: |
          git config user.name 'A Bulls App Source Sync'
          git config user.email 'actions@users.noreply.github.com'
          mv site /tmp/a-bulls-app-site
          git switch --orphan live-source-sync
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/a-bulls-app-site/. .
          git add -A
          git commit -m 'Sync current deployed A Bulls App source'
          git push --force origin HEAD:live-source-sync
