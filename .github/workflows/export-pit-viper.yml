name: Export Pit Viper web model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/visor-source/**"
      - "scripts/export-pit-viper.py"
      - ".github/workflows/export-pit-viper.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Export without embedded auto-execution
        run: >-
          blender --background --disable-autoexec
          "assets/visor-source/pit-viper.blend"
          --python "scripts/export-pit-viper.py"
      - name: Inspect export
        run: ls -lh public/models
      - name: Upload web model
        uses: actions/upload-artifact@v4
        with:
          name: pit-viper-web-model
          path: public/models/
          if-no-files-found: error
