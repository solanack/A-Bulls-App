name: Afterbell and Replay finalization
on:
  push:
    paths:
      - '.github/workflows/afterbell-live-entry.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic Replay upgrade
        run: |
          python3 scripts/apply-hackathon-replay-upgrade.py
          python3 scripts/fix-replay-density.py
      - name: Verify repository
        run: |
          npm install --ignore-scripts
          npm run typecheck
          npm test
          npm run build
          test -f .vercel/output/static/afterbell/index.html
          grep -R -q 'AFTERBELL' .vercel/output/static/assets
      - name: Commit verified source
        run: |
          git config user.name "A Bulls Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add workers/intelligence-replay-bundle.mjs workers/intelligence-replay-bundle.test.mjs src/components/universe-workspace.tsx src/components/replay-workspace.tsx scripts/replay-cinematic-contract.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: finish adaptive cinematic Replay"
          git push origin HEAD:main
