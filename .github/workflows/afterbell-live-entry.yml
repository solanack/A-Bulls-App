name: Afterbell sibling galaxy verification
on:
  push:
    paths:
      - '.github/workflows/afterbell-live-entry.yml'
permissions:
  contents: write
jobs:
  verify-afterbell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/afterbell-field-galaxy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Afterbell sibling galaxy integration
        run: |
          python3 scripts/apply-afterbell-field-galaxy.py
          python3 scripts/fix-afterbell-galaxy-zero.py
      - name: Verify complete repository and static deep-link
        run: |
          npm install --ignore-scripts
          npm run typecheck
          npm test
          npm run build
          test -f .vercel/output/static/afterbell/index.html
          grep -R -q 'AFTERBELL' .vercel/output/static/afterbell/index.html
      - name: Commit verified source
        run: |
          git config user.name "A Bulls Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/field/types.ts src/lib/field/galaxies.ts src/lib/field/synthetic-universe.ts src/lib/universe-data/afterbell-client.ts src/lib/field/afterbell-galaxy.ts src/lib/field/afterbell-galaxy.test.ts src/lib/field/field-os.ts src/components/app-shell.tsx scripts/galaxy-contract.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: make Afterbell a sibling Field galaxy"
          git push origin HEAD:feat/afterbell-field-galaxy
