name: Replay live repair verification
on:
  push:
    branches:
      - fix/replay-live-smoke-final
    paths:
      - '.github/workflows/afterbell-live-entry.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/replay-live-smoke-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply live Replay repair
        run: python3 scripts/apply-replay-live-smoke-fix.py
      - name: Verify repository
        run: |
          npm install --ignore-scripts
          npm run typecheck
          npm test
          npm run build
          test -f .vercel/output/static/afterbell/index.html
          grep -R -q 'AFTERBELL' .vercel/output/static/assets
      - name: Commit verified repair
        run: |
          git config user.name "A Bulls Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add workers/intelligence-replay-bundle.mjs workers/intelligence-replay-bundle.test.mjs workers/intelligence-chain-registry.mjs workers/intelligence-chain-registry.test.mjs workers/intelligence-history-engine.mjs workers/intelligence-history-engine.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: repair adaptive Replay candles and history health"
          git push origin HEAD:fix/replay-live-smoke-final
