name: Solana Intelligence Compatibility CI

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Intelligence syntax
        run: |
          set -euo pipefail
          for f in workers/intelligence-*.mjs; do node --check "$f"; done
          for f in js/intelligence-workspace-*.mjs js/replay-*.mjs js/trade-*.mjs js/temporal-*.mjs; do
            [ -e "$f" ] && node --check "$f"
          done
      - name: Intelligence tests
        run: |
          set -euo pipefail
          node --test workers/intelligence-*.test.mjs
          node --test js/temporal-replay-engine.test.mjs js/trade-comparison-replay.test.mjs
      - name: vNext wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'IntelligenceWorkspace' js/experience-entry.mjs
          grep -q '/api/intelligence/replay-bundle' workers/intelligence-replay-bundle.mjs
          grep -q 'handleReplayBundleRequest' workers/intelligence-worker-hooks.mjs
          grep -q 'intelligence-workspace-vnext' sw.js
          grep -q 'replay-bundle-client' sw.js
      - name: Retired product guard
        shell: bash
        run: |
          set -euo pipefail
          test ! -e js/life.js
          test ! -e js/bull-intelligence.js
          test ! -e js/bull-vision.js
          test ! -e js/track.js
          test ! -e js/ui.js
          ! grep -Eiq 'Ansem\.io|\$ANSEM|Bullpen|community-integrations|claude-of-duty|Solana Bang Bang|BBRLife|lifeView' index.html js/config.js js/product-registry.mjs js/experience-entry.mjs js/intelligence-workspace-vnext.mjs workers/intelligence-asset-router.mjs workers/intelligence-operations.mjs workers/migrations/0010_intelligence_mesh_runtime.sql
      - name: Generic NFT capability remains
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/intelligence/nft-memory' workers/intelligence-asset-router.mjs
          grep -q 'nftMemory' workers/intelligence-asset-router.mjs
      - name: Read-only guardrails
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq 'seed phrase|private key import|signTransaction|sendTransaction|secretKey' workers/intelligence-*.mjs js/intelligence-workspace-*.mjs js/replay-*.mjs js/trade-*.mjs js/temporal-*.mjs
