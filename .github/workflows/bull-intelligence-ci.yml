name: Bull Intelligence CI

on:
  push:
    branches:
      - feature/bull-intelligence-engine
  pull_request:
    paths:
      - 'js/bull-intelligence.js'
      - 'js/intelligence-core.js'
      - 'js/intelligence-lab.js'
      - 'js/intelligence-time-machine.js'
      - 'js/intelligence-radar-weather.js'
      - 'js/intelligence-where-were-you.js'
      - 'js/intelligence-constellation.js'
      - 'js/intelligence-nft-memory.js'
      - 'js/intelligence-ghost-portfolio.js'
      - 'js/intelligence-game-weather.js'
      - 'js/life.js'
      - 'js/main.js'
      - 'js/core.js'
      - 'workers/bull-intelligence-extension.mjs'
      - 'workers/intelligence-indexer.mjs'
      - 'workers/intelligence-aggregates.mjs'
      - 'workers/migrations/0007_bull_intelligence.sql'
      - 'workers/migrations/0008_bull_nft_intelligence.sql'
      - 'workers/wrangler.toml'
      - 'sw.js'
      - 'tests/bull-intelligence.test.mjs'
      - 'tests/intelligence-core.test.mjs'
      - 'tests/intelligence-lab.test.mjs'
      - 'tests/intelligence-time-machine.test.mjs'
      - 'tests/intelligence-ghost-portfolio.test.mjs'
      - 'tests/bull-intelligence-worker.test.mjs'
      - 'tests/intelligence-indexer.test.mjs'
      - 'tests/intelligence-aggregates.test.mjs'
      - 'docs/BULL-INTELLIGENCE-ENGINE.md'
      - 'docs/BULL-INTELLIGENCE-D1-SCHEMA.sql'
      - '.github/workflows/bull-intelligence-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check js/bull-intelligence.js
          node --check js/intelligence-core.js
          node --check js/intelligence-lab.js
          node --check js/intelligence-time-machine.js
          node --check js/intelligence-radar-weather.js
          node --check js/intelligence-where-were-you.js
          node --check js/intelligence-constellation.js
          node --check js/intelligence-nft-memory.js
          node --check js/intelligence-ghost-portfolio.js
          node --check js/intelligence-game-weather.js
          node --check js/life.js
          node --check js/main.js
          node --check workers/bull-intelligence-extension.mjs
          node --check workers/intelligence-indexer.mjs
          node --check workers/intelligence-aggregates.mjs
          node --check sw.js
      - name: Bull Intelligence unit tests
        run: |
          node tests/bull-intelligence.test.mjs
          node tests/intelligence-core.test.mjs
          node tests/intelligence-lab.test.mjs
          node tests/intelligence-time-machine.test.mjs
          node tests/intelligence-ghost-portfolio.test.mjs
          node tests/bull-intelligence-worker.test.mjs
          node tests/intelligence-indexer.test.mjs
          node tests/intelligence-aggregates.test.mjs
      - name: Intelligence release wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q "intelligence-radar-weather.js?v=8.6.0" js/main.js
          grep -q "BBRRadarWeather" js/main.js
          grep -q "intelligence-where-were-you.js?v=8.6.0" js/main.js
          grep -q "BBRWhereWereYou" js/main.js
          grep -q "intelligence-constellation.js?v=8.6.0" js/main.js
          grep -q "BBRWalletConstellation" js/main.js
          grep -q "intelligence-nft-memory.js?v=8.6.0" js/main.js
          grep -q "BBRNFTMemory" js/main.js
          grep -q "intelligence-ghost-portfolio.js?v=8.6.0" js/main.js
          grep -q "BBRGhostPortfolio" js/main.js
          grep -q "intelligence-game-weather.js?v=8.6.0" js/main.js
          grep -q "BBRCampaignChainWeather" js/main.js
          grep -q "./js/intelligence-radar-weather.js" sw.js
          grep -q "./js/intelligence-where-were-you.js" sw.js
          grep -q "./js/intelligence-constellation.js" sw.js
          grep -q "./js/intelligence-nft-memory.js" sw.js
          grep -q "./js/intelligence-ghost-portfolio.js" sw.js
          grep -q "./js/intelligence-game-weather.js" sw.js
          grep -q "/api/intelligence/radar" workers/bull-intelligence-extension.mjs
          grep -q "/api/intelligence/weather" workers/bull-intelligence-extension.mjs
          grep -q "/api/intelligence/wallet-summary" workers/bull-intelligence-extension.mjs
          grep -q "/api/intelligence/nft-memory" workers/bull-intelligence-extension.mjs
      - name: Schema and migration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'price_usd REAL' workers/migrations/0007_bull_intelligence.sql
          grep -q 'bull_token_wallet_buckets' workers/migrations/0007_bull_intelligence.sql
          grep -q 'CREATE TABLE IF NOT EXISTS bull_nft_wallet_events' workers/migrations/0008_bull_nft_intelligence.sql
          grep -q 'CREATE TABLE IF NOT EXISTS bull_nft_collection_cohorts' workers/migrations/0008_bull_nft_intelligence.sql
          grep -q 'price_usd REAL' docs/BULL-INTELLIGENCE-D1-SCHEMA.sql
          grep -q '# BULL_INDEXER_ENABLED = "true"' workers/wrangler.toml
          if grep -Eq '^[[:space:]]*BULL_INDEXER_ENABLED[[:space:]]*=' workers/wrangler.toml; then
            echo 'Bull Intelligence indexing must remain disabled until migration 0007 is applied to production.'
            exit 1
          fi
          if grep -Eq '^[[:space:]]*BULL_NFT_INDEXER_ENABLED[[:space:]]*=' workers/wrangler.toml; then
            echo 'NFT indexing must remain disabled until migration 0008 and a normalized NFT ingest source are ready.'
            exit 1
          fi
      - name: Read-only product guardrails
        shell: bash
        run: |
          if grep -Eqi '(seed phrase|private key import|copy trading|sniper bot|submit transaction|signTransaction|sendTransaction)' js/bull-intelligence.js js/intelligence-core.js js/intelligence-lab.js js/intelligence-time-machine.js js/intelligence-radar-weather.js js/intelligence-where-were-you.js js/intelligence-constellation.js js/intelligence-nft-memory.js js/intelligence-ghost-portfolio.js js/intelligence-game-weather.js workers/bull-intelligence-extension.mjs workers/intelligence-indexer.mjs workers/intelligence-aggregates.mjs; then
            echo 'Forbidden execution/custody behavior detected in Bull Intelligence code.'
            exit 1
          fi
          grep -q 'Partial history is never presented as complete history' js/bull-intelligence.js
          grep -q 'not a claim about what the wallet would be worth today' js/intelligence-lab.js
          grep -q 'not a price prediction or trading recommendation' js/intelligence-core.js
          grep -q 'not a market forecast' js/intelligence-core.js
          grep -q 'does not recommend a strategy or predict future performance' js/intelligence-time-machine.js
          grep -q 'never infers real-world identity or location' js/intelligence-where-were-you.js
          grep -q 'never ownership or identity claims' js/intelligence-constellation.js
          grep -q 'never treats partial indexing as complete ownership history' js/intelligence-nft-memory.js
          grep -q "not today's value" js/intelligence-ghost-portfolio.js
          grep -q 'Never changes game state, collision, scoring, spawn rates' js/intelligence-game-weather.js
          grep -q "selectedMode() === 'arcade'" js/intelligence-game-weather.js
          grep -q 'publicAddressOnly: true' workers/bull-intelligence-extension.mjs
          grep -q 'Public address only' docs/BULL-INTELLIGENCE-ENGINE.md
