name: Bull Intelligence CI

on:
  push:
    branches:
      - feature/bull-intelligence-engine
  pull_request:
    paths:
      - 'js/bull-intelligence.js'
      - 'js/intelligence-core.js'
      - 'js/intelligence-lab.js'
      - 'js/intelligence-time-machine.js'
      - 'js/life.js'
      - 'js/main.js'
      - 'js/core.js'
      - 'workers/bull-intelligence-extension.mjs'
      - 'workers/intelligence-indexer.mjs'
      - 'workers/intelligence-aggregates.mjs'
      - 'workers/migrations/0007_bull_intelligence.sql'
      - 'workers/wrangler.toml'
      - '.worker-sync/worker.js.gz.b64.part-*'
      - 'sw.js'
      - 'tests/bull-intelligence.test.mjs'
      - 'tests/intelligence-core.test.mjs'
      - 'tests/intelligence-lab.test.mjs'
      - 'tests/intelligence-time-machine.test.mjs'
      - 'tests/bull-intelligence-worker.test.mjs'
      - 'tests/intelligence-indexer.test.mjs'
      - 'tests/intelligence-aggregates.test.mjs'
      - 'docs/BULL-INTELLIGENCE-ENGINE.md'
      - 'docs/BULL-INTELLIGENCE-D1-SCHEMA.sql'
      - '.github/workflows/bull-intelligence-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and verify exact Worker payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, zlib

          expected = '351b491f7729c3d15f81e5e574f22d20f472271dc937691223e66def757de64d'
          files = sorted(Path('.worker-sync').glob('worker.js.gz.b64.part-*'))
          encoded = ''.join(p.read_text().strip() for p in files)

          def verify(text):
              try:
                  compressed = base64.b64decode(text, validate=True)
                  source = gzip.decompress(compressed)
              except Exception:
                  return None
              return source if hashlib.sha256(source).hexdigest() == expected else None

          source = verify(encoded)
          if source is None and len(encoded) % 4 == 3:
              # One chunk was shortened by one character by the repository transport.
              # Locate the first DEFLATE failure to narrow the insertion search.
              padded = encoded + '='
              try:
                  compressed = base64.b64decode(padded, validate=False)
              except Exception:
                  compressed = b''
              inflater = zlib.decompressobj(16 + zlib.MAX_WBITS)
              failure = None
              for index, byte in enumerate(compressed):
                  try:
                      inflater.decompress(bytes([byte]))
                  except zlib.error:
                      failure = index
                      break
              approx = int((failure if failure is not None else 21000) * 4 / 3)
              alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
              lo_bound, hi_bound = 24000, min(32000, len(encoded) + 1)
              searched = set()
              for radius in (96, 384, 1536, 4096):
                  lo = max(lo_bound, approx - radius)
                  hi = min(hi_bound, approx + radius + 1)
                  for pos in range(lo, hi):
                      if pos in searched:
                          continue
                      searched.add(pos)
                      for char in alphabet:
                          candidate = encoded[:pos] + char + encoded[pos:]
                          recovered = verify(candidate)
                          if recovered is not None:
                              source = recovered
                              print(f'RECOVERED_WORKER_BASE64 position={pos} char={char}')
                              Path('/tmp/recovered-worker.b64').write_text(candidate)
                              break
                      if source is not None:
                          break
                  if source is not None:
                      break
          if source is None:
              raise SystemExit('Unable to reconstruct verified Worker 8.1.0 payload')
          Path('/tmp/worker-8.1.0.mjs').write_bytes(source)
          print('Worker SHA-256:', hashlib.sha256(source).hexdigest())
          PY
          echo '351b491f7729c3d15f81e5e574f22d20f472271dc937691223e66def757de64d  /tmp/worker-8.1.0.mjs' | sha256sum -c -
          node --check /tmp/worker-8.1.0.mjs
          grep -q "const VERSION = '8.1.0';" /tmp/worker-8.1.0.mjs
          grep -q "'/api/intelligence/time-machine'" /tmp/worker-8.1.0.mjs
          grep -q "'/api/intelligence/parallel-universe'" /tmp/worker-8.1.0.mjs
          grep -q "'/api/intelligence/radar'" /tmp/worker-8.1.0.mjs
          grep -q "'/api/intelligence/weather'" /tmp/worker-8.1.0.mjs
          grep -q 'indexWalletActivityObservations' /tmp/worker-8.1.0.mjs
          grep -q "workerRequired: '8.1.0'" js/core.js
      - name: Worker route smoke test
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const mod = await import('file:///tmp/worker-8.1.0.mjs');
          const worker = mod.default;
          if (!worker || typeof worker.fetch !== 'function') throw new Error('Worker default fetch export missing');
          let response = await worker.fetch(new Request('https://worker.test/api/health'), {}, { waitUntil() {} });
          if (response.status !== 200) throw new Error(`health returned ${response.status}`);
          response = await worker.fetch(new Request('https://worker.test/api/intelligence/capabilities'), {}, { waitUntil() {} });
          if (response.status !== 200) throw new Error(`capabilities returned ${response.status}`);
          const capabilities = await response.json();
          if (capabilities?.capabilities?.readOnly !== true || capabilities?.capabilities?.publicAddressOnly !== true) {
            throw new Error('read-only/public-address capability contract failed');
          }
          response = await worker.fetch(new Request('https://worker.test/api/intelligence/time-machine', {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ wallet: 'bad' })
          }), {}, { waitUntil() {} });
          if (response.status !== 400) throw new Error(`invalid wallet expected 400, got ${response.status}`);
          console.log('Worker 8.1.0 Intelligence route smoke test passed.');
          NODE
      - name: JavaScript syntax
        run: |
          node --check js/bull-intelligence.js
          node --check js/intelligence-core.js
          node --check js/intelligence-lab.js
          node --check js/intelligence-time-machine.js
          node --check js/life.js
          node --check js/main.js
          node --check workers/bull-intelligence-extension.mjs
          node --check workers/intelligence-indexer.mjs
          node --check workers/intelligence-aggregates.mjs
          node --check sw.js
      - name: Bull Intelligence unit tests
        run: |
          node tests/bull-intelligence.test.mjs
          node tests/intelligence-core.test.mjs
          node tests/intelligence-lab.test.mjs
          node tests/intelligence-time-machine.test.mjs
          node tests/bull-intelligence-worker.test.mjs
          node tests/intelligence-indexer.test.mjs
          node tests/intelligence-aggregates.test.mjs
      - name: Schema and migration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'price_usd REAL' workers/migrations/0007_bull_intelligence.sql
          grep -q 'bull_token_wallet_buckets' workers/migrations/0007_bull_intelligence.sql
          grep -q 'price_usd REAL' docs/BULL-INTELLIGENCE-D1-SCHEMA.sql
          grep -q '# BULL_INDEXER_ENABLED = "true"' workers/wrangler.toml
          if grep -Eq '^[[:space:]]*BULL_INDEXER_ENABLED[[:space:]]*=' workers/wrangler.toml; then
            echo 'Bull Intelligence indexing must remain disabled until migration 0007 is applied to production.'
            exit 1
          fi
      - name: Read-only product guardrails
        shell: bash
        run: |
          if grep -Eqi '(seed phrase|private key import|copy trading|sniper bot|submit transaction|signTransaction|sendTransaction)' js/bull-intelligence.js js/intelligence-core.js js/intelligence-lab.js js/intelligence-time-machine.js workers/bull-intelligence-extension.mjs workers/intelligence-indexer.mjs workers/intelligence-aggregates.mjs; then
            echo 'Forbidden execution/custody behavior detected in Bull Intelligence code.'
            exit 1
          fi
          grep -q 'Partial history is never presented as complete history' js/bull-intelligence.js
          grep -q 'not a claim about what the wallet would be worth today' js/intelligence-lab.js
          grep -q 'not a price prediction or trading recommendation' js/intelligence-core.js
          grep -q 'not a market forecast' js/intelligence-core.js
          grep -q 'does not recommend a strategy or predict future performance' js/intelligence-time-machine.js
          grep -q 'publicAddressOnly: true' workers/bull-intelligence-extension.mjs
          grep -q 'Public address only' docs/BULL-INTELLIGENCE-ENGINE.md
