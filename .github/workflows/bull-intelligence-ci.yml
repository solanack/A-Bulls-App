name: Bull Intelligence CI

on:
  push:
    branches:
      - feature/bull-intelligence-engine
  pull_request:
    paths:
      - 'js/bull-intelligence.js'
      - 'js/intelligence-core.js'
      - 'js/intelligence-lab.js'
      - 'js/intelligence-time-machine.js'
      - 'js/life.js'
      - 'js/main.js'
      - 'js/core.js'
      - 'workers/bull-intelligence-extension.mjs'
      - 'workers/intelligence-indexer.mjs'
      - 'workers/intelligence-aggregates.mjs'
      - 'workers/migrations/0007_bull_intelligence.sql'
      - 'workers/wrangler.toml'
      - '.worker-sync/worker.js.gz.b64'
      - 'sw.js'
      - 'tests/bull-intelligence.test.mjs'
      - 'tests/intelligence-core.test.mjs'
      - 'tests/intelligence-lab.test.mjs'
      - 'tests/intelligence-time-machine.test.mjs'
      - 'tests/bull-intelligence-worker.test.mjs'
      - 'tests/intelligence-indexer.test.mjs'
      - 'tests/intelligence-aggregates.test.mjs'
      - 'docs/BULL-INTELLIGENCE-ENGINE.md'
      - 'docs/BULL-INTELLIGENCE-D1-SCHEMA.sql'
      - '.github/workflows/bull-intelligence-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and verify exact Worker payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .worker-sync/worker.js.gz.b64 | gzip -dc > /tmp/worker-8.1.0.js
          echo '27db8a5ec6ea7b31cd800843c8d86f12ea77c94fec17be3fa4acc9f471b6cb26  /tmp/worker-8.1.0.js' | sha256sum -c -
          node --check /tmp/worker-8.1.0.js
          grep -q "const VERSION = '8.1.0';" /tmp/worker-8.1.0.js
          grep -q "'/api/intelligence/time-machine'" /tmp/worker-8.1.0.js
          grep -q "'/api/intelligence/parallel-universe'" /tmp/worker-8.1.0.js
          grep -q "'/api/intelligence/radar'" /tmp/worker-8.1.0.js
          grep -q "'/api/intelligence/weather'" /tmp/worker-8.1.0.js
          grep -q 'indexWalletActivityObservations' /tmp/worker-8.1.0.js
          grep -q "workerRequired: '8.1.0'" js/core.js
      - name: JavaScript syntax
        run: |
          node --check js/bull-intelligence.js
          node --check js/intelligence-core.js
          node --check js/intelligence-lab.js
          node --check js/intelligence-time-machine.js
          node --check js/life.js
          node --check js/main.js
          node --check workers/bull-intelligence-extension.mjs
          node --check workers/intelligence-indexer.mjs
          node --check workers/intelligence-aggregates.mjs
          node --check sw.js
      - name: Bull Intelligence unit tests
        run: |
          node tests/bull-intelligence.test.mjs
          node tests/intelligence-core.test.mjs
          node tests/intelligence-lab.test.mjs
          node tests/intelligence-time-machine.test.mjs
          node tests/bull-intelligence-worker.test.mjs
          node tests/intelligence-indexer.test.mjs
          node tests/intelligence-aggregates.test.mjs
      - name: Schema and migration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'price_usd REAL' workers/migrations/0007_bull_intelligence.sql
          grep -q 'bull_token_wallet_buckets' workers/migrations/0007_bull_intelligence.sql
          grep -q 'price_usd REAL' docs/BULL-INTELLIGENCE-D1-SCHEMA.sql
          grep -q '# BULL_INDEXER_ENABLED = "true"' workers/wrangler.toml
          if grep -Eq '^[[:space:]]*BULL_INDEXER_ENABLED[[:space:]]*=' workers/wrangler.toml; then
            echo 'Bull Intelligence indexing must remain disabled until migration 0007 is applied to production.'
            exit 1
          fi
      - name: Read-only product guardrails
        shell: bash
        run: |
          if grep -Eqi '(seed phrase|private key import|copy trading|sniper bot|submit transaction|signTransaction|sendTransaction)' js/bull-intelligence.js js/intelligence-core.js js/intelligence-lab.js js/intelligence-time-machine.js workers/bull-intelligence-extension.mjs workers/intelligence-indexer.mjs workers/intelligence-aggregates.mjs; then
            echo 'Forbidden execution/custody behavior detected in Bull Intelligence code.'
            exit 1
          fi
          grep -q 'Partial history is never presented as complete history' js/bull-intelligence.js
          grep -q 'not a claim about what the wallet would be worth today' js/intelligence-lab.js
          grep -q 'not a price prediction or trading recommendation' js/intelligence-core.js
          grep -q 'not a market forecast' js/intelligence-core.js
          grep -q 'does not recommend a strategy or predict future performance' js/intelligence-time-machine.js
          grep -q 'publicAddressOnly: true' workers/bull-intelligence-extension.mjs
          grep -q 'Public address only' docs/BULL-INTELLIGENCE-ENGINE.md
