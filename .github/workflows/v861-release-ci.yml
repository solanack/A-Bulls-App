name: v8.6.1 Release Gate

on:
  push:
    branches:
      - release/v8.6.1-intelligence
  pull_request:
    branches:
      - release/v8.6.1-intelligence

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          set -euo pipefail
          for f in \
            js/core.js js/main.js js/bull-vision.js js/bull-intelligence.js \
            js/intelligence-core.js js/intelligence-lab.js js/intelligence-time-machine.js \
            js/intelligence-radar-weather.js js/intelligence-where-were-you.js \
            js/intelligence-constellation.js js/intelligence-nft-memory.js \
            js/intelligence-ghost-portfolio.js js/intelligence-game-weather.js \
            js/life.js sw.js workers/bull-intelligence-extension.mjs \
            workers/intelligence-indexer.mjs workers/intelligence-aggregates.mjs \
            workers/intelligence-nft-indexer.mjs workers/intelligence-refresh.mjs; do
            node --check "$f"
          done
      - name: Unit and contract tests
        run: |
          set -euo pipefail
          node tests/bull-intelligence.test.mjs
          node tests/intelligence-core.test.mjs
          node tests/intelligence-lab.test.mjs
          node tests/intelligence-time-machine.test.mjs
          node tests/intelligence-ghost-portfolio.test.mjs
          node tests/bull-intelligence-worker.test.mjs
          node tests/intelligence-indexer.test.mjs
          node tests/intelligence-aggregates.test.mjs
          node tests/intelligence-nft-indexer.test.mjs
          node tests/intelligence-refresh.test.mjs
      - name: Release version contract
        run: |
          set -euo pipefail
          grep -q "version: '8.6.1'" js/core.js
          grep -q "workerRequired: '8.1.0'" js/core.js
          grep -q "const BUILD = '8.6.1'" sw.js
          grep -q "sw.js?v=8.6.1" js/main.js
          grep -q "intelligence-game-weather.js?v=8.6.1" js/main.js
          grep -q "intelligence-nft-memory.js?v=8.6.1" js/main.js
          grep -q "intelligence-ghost-portfolio.js?v=8.6.1" js/main.js
      - name: Migration safety
        run: |
          set -euo pipefail
          grep -q 'CREATE TABLE IF NOT EXISTS bull_wallet_events' workers/migrations/0007_bull_intelligence.sql
          grep -q 'CREATE TABLE IF NOT EXISTS bull_nft_wallet_events' workers/migrations/0008_bull_nft_intelligence.sql
          grep -q '# BULL_INDEXER_ENABLED = "true"' workers/wrangler.toml
          if grep -Eq '^[[:space:]]*BULL_INDEXER_ENABLED[[:space:]]*=' workers/wrangler.toml; then
            echo 'Token intelligence indexing must stay disabled until live migration 0007 is applied.'
            exit 1
          fi
          if grep -Eq '^[[:space:]]*BULL_NFT_INDEXER_ENABLED[[:space:]]*=' workers/wrangler.toml; then
            echo 'NFT indexing must stay disabled until live migration 0008 and ingest are ready.'
            exit 1
          fi
      - name: Ranked isolation and read-only guardrails
        run: |
          set -euo pipefail
          grep -q "selectedMode() === 'arcade'" js/intelligence-game-weather.js
          grep -q 'Never changes game state, collision, scoring, spawn rates' js/intelligence-game-weather.js
          if grep -Eqi '(seed phrase|private key import|copy trading|sniper bot|signTransaction|sendTransaction)' \
            js/bull-intelligence.js js/intelligence-*.js workers/bull-intelligence-extension.mjs \
            workers/intelligence-*.mjs; then
            echo 'Forbidden custody/execution behavior detected.'
            exit 1
          fi
