name: Phase 1 provider secret audit

on:
  push:
    branches: [phase-1-provider-secrets]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is unavailable to Actions"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is unavailable to Actions"; exit 1; }
      - name: Install tooling
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Read configured Cloudflare secret names
        run: npx wrangler secret list --config workers/wrangler.production.toml --format json | tee configured-provider-secrets.json
      - name: Verify provider secret coverage
        run: node scripts/check-provider-secrets.mjs --configured-file configured-provider-secrets.json
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-secret-audit-${{ github.sha }}
          path: configured-provider-secrets.json
          if-no-files-found: error
          retention-days: 7
