name: Phase 1 provider secret audit

on:
  push:
    branches: [phase-1-provider-secrets]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is unavailable to Actions"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is unavailable to Actions"; exit 1; }
      - name: Install tooling
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Enumerate code-referenced provider secrets
        shell: bash
        run: |
          set -euo pipefail
          grep -RhnE 'env\.[A-Z][A-Z0-9_]*(API_KEY|_TOKEN|_SECRET)' workers --include='*.mjs' | tee provider-secret-references.txt
          grep -RhoE 'env\.[A-Z][A-Z0-9_]*(API_KEY|_TOKEN|_SECRET)' workers --include='*.mjs' \
            | sed 's/^env\.//' | sort -u | tee referenced-provider-secrets.txt
          test -s referenced-provider-secrets.txt
      - name: Read configured Cloudflare secret names
        run: npx wrangler secret list --config workers/wrangler.production.toml --format json | tee configured-provider-secrets.json
      - name: Compare referenced and configured names
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const required=fs.readFileSync('referenced-provider-secrets.txt','utf8').split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
          const parsed=JSON.parse(fs.readFileSync('configured-provider-secrets.json','utf8'));
          const rows=Array.isArray(parsed)?parsed:Array.isArray(parsed?.result)?parsed.result:[];
          const configured=new Set(rows.map(row=>String(row?.name||row?.key||'').trim()).filter(Boolean));
          const missing=required.filter(name=>!configured.has(name));
          console.log(`Referenced provider secrets (${required.length}): ${required.join(', ')}`);
          console.log(`Configured secret names (${configured.size}): ${[...configured].sort().join(', ')}`);
          if(missing.length){
            console.error(`::error::Missing production provider secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log('All code-referenced provider secrets are configured in production.');
          NODE
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-secret-audit-${{ github.sha }}
          path: |
            provider-secret-references.txt
            referenced-provider-secrets.txt
            configured-provider-secrets.json
          if-no-files-found: warn
          retention-days: 7
