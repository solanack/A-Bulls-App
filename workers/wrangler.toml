name = "black-bull-run-sol-api"
main = "worker-vnext-entry.mjs"
compatibility_date = "2026-08-01"

[build]
command = "node ../scripts/reconstruct-worker-8.2.0.mjs"

[triggers]
crons = ["*/15 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://abullsapp.com,https://www.abullsapp.com,https://black-bull-run-sol.pages.dev,http://localhost:8788"
# vNext server products remain fail-closed until explicitly enabled after migration/verification.
UNIVERSE_ENABLED = "false"
TRICKSTER_STUDIO_ENABLED = "false"
PLAYABLE_DATA_ENABLED = "false"
INTELLIGENCE_MESH_ENABLED = "false"

# Optional neutral Solana RPC override. Leave unset to use the configured/default read-only RPC path.
# INTELLIGENCE_RPC_URL = "https://api.mainnet-beta.solana.com"
# Protected internal ingest secret must be stored with Wrangler, never in this file:
# npx wrangler secret put INTELLIGENCE_MESH_INGEST_TOKEN

# Existing identity/game secrets retained from the verified Worker 8.2.0 baseline:
# npx wrangler secret put HELIUS_API_KEY
# npx wrangler secret put GOOGLE_CLIENT_ID
# npx wrangler secret put AUTH_SESSION_SECRET

# Existing D1 leaderboard binding. The neutral Intelligence runtime can share the configured DB
# through its supported binding aliases until a dedicated binding is selected.
# [[d1_databases]]
# binding = "LEADERBOARD_DB"
# database_name = "black-bull-run-leaderboard"
# database_id = "<YOUR_D1_DATABASE_ID>"

# Optional shared cache retained for compatible baseline routes.
# [[kv_namespaces]]
# binding = "ANALYTICS_CACHE"
# id = "<YOUR_KV_NAMESPACE_ID>"

# Production Cloudflare Rate Limiting binding. Wrangler 4.36+ is required.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
#   [ratelimits.simple]
#   limit = 60
#   period = 60

[observability]
enabled = true
head_sampling_rate = 0.1
