name = "black-bull-run-sol"
main = "worker-vnext-entry.mjs"
compatibility_date = "2026-08-01"

[triggers]
crons = ["*/15 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://abullsapp.com,https://www.abullsapp.com"
UNIVERSE_ENABLED = "true"
TRICKSTER_STUDIO_ENABLED = "true"
TRICKSTER_SHARE_ENABLED = "true"
PLAYABLE_DATA_ENABLED = "true"
FIELD_COMPAT_ENABLED = "true"
FIELD_V0_ENABLED = "true"
FIELD_QUERY_CACHE_TTL_SECONDS = "60"

FOMO_GALAXY_ENABLED = "true"
FOMO_REFRESH_MINUTES = "180"
FOMO_PROFILE_LOOKUPS_PER_REFRESH = "0"
FOMO_BOOTSTRAP_ENRICH_LIMIT = "10"
FOMO_ENRICH_TRADERS_PER_REFRESH = "1"
FOMOAPI_MONTHLY_CREDITS = "1000"
FOMOAPI_BREAKER_RATIO = "0.80"

PONS_GALAXY_ENABLED = "true"
PONS_INDEX_ENABLED = "true"
PONS_RANK_ENABLED = "true"
PONS_MARKET_CAP_MIN_USD = "75000"
PONS_MIN_HOLDERS = "750"
PONS_RANK_MAX_MEMBERS = "50"
PONS_TRENDING_ENRICH_LIMIT = "30"
PONS_TRENDING_METRIC_MAX_AGE_SECONDS = "3600"
PONS_BLOCKSCOUT_DISCOVERY_PAGES = "4"
PONS_RANK_REFRESH_MINUTES = "15"
PONS_CONFIRMATIONS = "64"
PONS_BLOCK_CHUNK = "2000"
PONS_REORG_REWIND = "32"
PONS_MARKET_ENRICH_ENABLED = "true"
PONS_MARKET_ENRICH_LIMIT = "8"
PONS_RPC_FALLBACK_URLS = "https://rpc.mainnet.chain.robinhood.com"
HELIUS_BREAKER_RATIO = "0.75"
HELIUS_MONTHLY_CREDITS = "1000000"

# Conservative test mode: populate Universe sparingly while broad/history paths stay off.
ECOSYSTEM_UNIVERSES_ENABLED = "true"
INTELLIGENCE_MESH_ENABLED = "true"
INTELLIGENCE_SCHEDULER_BATCH_SIZE = "1"
BULL_INDEXER_ENABLED = "false"
BULL_NFT_INDEXER_ENABLED = "false"
BULL_ARCHIVAL_ENABLED = "false"
MARKET_BACKFILL_QUEUE_ENABLED = "true"
INTELLIGENCE_EXTERNAL_RETRIEVAL_ENABLED = "false"
INTELLIGENCE_SUBSTREAMS_HISTORY_ENABLED = "false"
INTELLIGENCE_OLD_FAITHFUL_HISTORY_ENABLED = "false"

PUMP_INDEX_ENABLED = "true"
PUMP_INDEX_SOURCE = "ansem-z500"
PUMP_STREAM_ENABLED = "true"
PUMP_ACTIVE_TOKEN_LIMIT = "10"
PUMP_MONTHLY_CREDIT_BUDGET = "1000000"
PUMP_BUDGET_WARNING_PERCENT = "60"
PUMP_BUDGET_HARD_STOP_PERCENT = "80"
PUMP_RANK_REFRESH_MINUTES = "15"
PUMP_RAW_RETENTION_HOURS = "72"
PUMP_CANDLE_RETENTION_DAYS = "365"
PUMP_INGEST_CREDIT_MODE = "webhook"
PUMP_HELIUS_WEBHOOK_ID = "06af243a-c7a6-445f-8966-31d3d46b9ddc"

PONS_BOOTSTRAP_LOOKBACK_BLOCKS = "16000"
PONS_SCAN_CHUNKS_PER_RUN = "8"
# Optional private RPC override: npx wrangler secret put PONS_RPC_URL --config workers/wrangler.production.toml
# Optional legacy Bitquery holder fallback is no longer required for PonsFamily self-population.
# Protected manual ranking route only: npx wrangler secret put PONS_INDEX_SECRET --config workers/wrangler.production.toml
# Required for Fomo Galaxy source data: npx wrangler secret put FOMOAPI_API_KEY --config workers/wrangler.production.toml

Z500_UNIVERSE_ENABLED = "false"
Z500_HELIUS_ROTATION_ENABLED = "false"
Z500_TOP_LIMIT = "10"
Z500_REFRESH_SECONDS = "900"
Z500_CONFIRMATION_CYCLES = "2"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "8262026"
  [ratelimits.simple]
  limit = 60
  period = 60

[observability]
enabled = true
head_sampling_rate = 0.1

[[services]]
binding = "SOCIAL_AUTH"
service = "a-bulls-app-frontend"

[[d1_databases]]
binding = "INTELLIGENCE_DB"
database_name = "a-bulls-app-intelligence"
database_id = "a54ed900-ccd0-4fe5-9522-71996e96d16b"
migrations_dir = "migrations"
