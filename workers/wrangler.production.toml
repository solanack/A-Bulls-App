name = "black-bull-run-sol"
main = "worker-vnext-entry.mjs"
compatibility_date = "2026-08-01"

[triggers]
crons = ["*/15 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://abullsapp.com,https://www.abullsapp.com"
UNIVERSE_ENABLED = "true"
TRICKSTER_STUDIO_ENABLED = "true"
TRICKSTER_SHARE_ENABLED = "true"
PLAYABLE_DATA_ENABLED = "true"
FIELD_COMPAT_ENABLED = "true"
FIELD_V0_ENABLED = "true"
FIELD_QUERY_CACHE_TTL_SECONDS = "60"

# Shared provider transport defaults. Each provider may override these with
# <PROVIDER>_FETCH_TIMEOUT_MS / _FETCH_RETRIES / _FETCH_BACKOFF_MS without code changes.
# One retry means two total attempts and applies only to transient network errors,
# timeouts, HTTP 429, and HTTP 5xx responses; evidence is never synthesized on failure.
PROVIDER_FETCH_TIMEOUT_MS = "6000"
PROVIDER_FETCH_RETRIES = "1"
PROVIDER_FETCH_BACKOFF_MS = "250"
FOMOAPI_FETCH_TIMEOUT_MS = "8000"
FOMOAPI_FETCH_RETRIES = "1"
FOMOAPI_FETCH_BACKOFF_MS = "350"
HELIUS_FETCH_TIMEOUT_MS = "8000"
HELIUS_FETCH_RETRIES = "1"
HELIUS_FETCH_BACKOFF_MS = "350"
COINGECKO_FETCH_TIMEOUT_MS = "8000"
COINGECKO_FETCH_RETRIES = "1"
COINGECKO_FETCH_BACKOFF_MS = "350"

FOMO_GALAXY_ENABLED = "true"
FOMO_REFRESH_MINUTES = "180"
FOMO_PROFILE_LOOKUPS_PER_REFRESH = "0"
# While the current top-50 has never-enriched traders, cron fills up to ten of those missing records per 15-minute tick.\n# Once current coverage is complete this consumes zero extra calls; the normal 3-hour refresh stays at one trader.\nFOMO_BOOTSTRAP_ENRICH_LIMIT = "10"\nFOMO_COVERAGE_BACKFILL_LIMIT = "10"\nFOMO_ENRICH_TRADERS_PER_REFRESH = "1"
# FOMO bills ordinary leaderboard/trade/balance reads at 250 raw credits each.
# 250,000 is the provider's published Free monthly floor (1,000 ordinary calls),
# not the old 1,000-call placeholder. Live provider observations may raise the
# effective tracked limit when the configured key has a larger real bucket.
FOMOAPI_MONTHLY_CREDITS = "250000"
FOMOAPI_BREAKER_RATIO = "0.80"
FOMOAPI_QUOTA_SOURCE = "fomoapi-published-free-floor"

# Chain-qualified market/evidence spine. Scheduled materialization reuses cached
# Fomo research objects, performs bounded market enrichment, and may verify a few
# structurally valid EVM transaction hashes through read-only RPC. Provider reports
# remain distinct from independently observed chain facts.
MULTICHAIN_MARKET_ENABLED = "true"
MULTICHAIN_EVIDENCE_ENABLED = "true"
MULTICHAIN_PUBLIC_RPC_FALLBACKS = "true"
MULTICHAIN_MARKET_ASSETS_PER_RUN = "60"
MULTICHAIN_FOMO_EVENTS_PER_RUN = "100"
MULTICHAIN_TX_VERIFY_LIMIT = "4"
# Pre-hydrate a few current Fomo trade windows per 15-minute cron so Replay charts
# are usually warm before the user opens them. Source data remains CoinGecko/
# GeckoTerminal OHLC; no synthetic candles are generated.
FOMO_REPLAY_CANDLE_PREWARM_PER_RUN = "4"
# Ask Fomo for a deeper recent trade window. The Worker automatically falls back
# to 25 if the provider rejects the larger limit, while closed trades already
# discovered by A Bulls remain durable in D1.
FOMO_TRADE_FETCH_LIMIT = "100"

# Helius currently publishes 1M / 10M / 100M / 200M monthly credit tiers.
# This 1M value is the conservative configured floor and is deliberately marked
# unverified until HELIUS_PROJECT_ID is supplied; with a project id the internal
# diagnostics can read Helius' authenticated usage endpoint and record the real
# plan/credit limit without exposing the API key.
HELIUS_BREAKER_RATIO = "0.75"
HELIUS_MONTHLY_CREDITS = "1000000"
HELIUS_QUOTA_SOURCE = "operator-config-unverified"

# Production wallet-history mesh. Each claimed wallet advances through two bounded
# 25-signature pages per execution, and up to three wallets can advance per cron.
# Replay requests also reuse this same bounded path in waitUntil, so older trade
# windows hydrate materially faster without enabling an unconfigured archive bridge.
ECOSYSTEM_UNIVERSES_ENABLED = "true"
INTELLIGENCE_MESH_ENABLED = "true"
INTELLIGENCE_SCHEDULER_BATCH_SIZE = "3"
INTELLIGENCE_HISTORY_PAGE_SIZE = "25"
INTELLIGENCE_HISTORY_PAGES_PER_RUN = "2"
INTELLIGENCE_HISTORY_RETRY_SECONDS = "5"
INTELLIGENCE_HISTORY_RPC_TIMEOUT_MS = "5000"
MARKET_BACKFILL_QUEUE_ENABLED = "true"
REPLAY_MARKET_POOL_PAGES = "3"

# These stay disabled intentionally until their upstream executors are actually
# configured. Turning them on without a live authenticated bridge would move jobs
# into waiting-external instead of improving Replay coverage.
FULL_CHAIN_STREAM_ENABLED = "false"
INTELLIGENCE_EXTERNAL_RETRIEVAL_ENABLED = "false"
INTELLIGENCE_SUBSTREAMS_HISTORY_ENABLED = "false"
INTELLIGENCE_OLD_FAITHFUL_HISTORY_ENABLED = "false"

# Legacy Bull capability toggles do not power the current Intelligence Mesh and
# remain off rather than claiming archival/index coverage that has not been measured.
BULL_INDEXER_ENABLED = "false"
BULL_NFT_INDEXER_ENABLED = "false"
BULL_ARCHIVAL_ENABLED = "false"

# Provider/auth secret inventory. Keep values out of TOML and use Wrangler secret put.
# Required for enabled Fomo Galaxy source data:
#   npx wrangler secret put FOMOAPI_API_KEY --config workers/wrangler.production.toml
# Required for enabled Solana history/enrichment:
#   npx wrangler secret put HELIUS_API_KEY --config workers/wrangler.production.toml
# Required for enabled multichain market enrichment:
#   npx wrangler secret put COINGECKO_API_KEY --config workers/wrangler.production.toml
# Required for the enabled Helius universe webhook auth; either dedicated secret OR
# the retained PUMP_INGEST_SECRET fallback must be configured:
#   npx wrangler secret put HELIUS_WEBHOOK_AUTH_SECRET --config workers/wrangler.production.toml
#   npx wrangler secret put PUMP_INGEST_SECRET --config workers/wrangler.production.toml
# Required only when FULL_CHAIN_STREAM_ENABLED or INTELLIGENCE_EXTERNAL_RETRIEVAL_ENABLED is true:
#   npx wrangler secret put INTELLIGENCE_MESH_INGEST_TOKEN --config workers/wrangler.production.toml
# Retained Pons compatibility (public PonsFamily galaxy is retired); either alias in each pair is sufficient:
#   npx wrangler secret put PONS_BITQUERY_TOKEN --config workers/wrangler.production.toml
#   npx wrangler secret put BITQUERY_API_TOKEN --config workers/wrangler.production.toml
#   npx wrangler secret put PONS_BLOCKSCOUT_API_KEY --config workers/wrangler.production.toml
#   npx wrangler secret put BLOCKSCOUT_API_KEY --config workers/wrangler.production.toml
# Retained Pons maintenance endpoint auth (not required by current public path):
#   npx wrangler secret put PONS_INDEX_SECRET --config workers/wrangler.production.toml

Z500_UNIVERSE_ENABLED = "false"
Z500_HELIUS_ROTATION_ENABLED = "false"
Z500_TOP_LIMIT = "10"
Z500_REFRESH_SECONDS = "900"
Z500_CONFIRMATION_CYCLES = "2"

# Temporarily 120/60s for Colosseum/Cut smoke headroom (Replay→Cut→Share);
# tighten back toward 60 later if Galaxy traffic stays calm.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "8262026"
  [ratelimits.simple]
  limit = 120
  period = 60

[observability]
enabled = true
head_sampling_rate = 0.1

[[services]]
binding = "SOCIAL_AUTH"
service = "a-bulls-app-frontend"

[[d1_databases]]
binding = "INTELLIGENCE_DB"
database_name = "a-bulls-app-intelligence"
database_id = "a54ed900-ccd0-4fe5-9522-71996e96d16b"
migrations_dir = "migrations"
