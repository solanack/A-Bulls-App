name = "black-bull-run-sol"
main = "worker-vnext-entry.mjs"
compatibility_date = "2026-08-01"

[triggers]
crons = ["*/15 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://abullsapp.com,https://www.abullsapp.com"
UNIVERSE_ENABLED = "true"
TRICKSTER_STUDIO_ENABLED = "true"
TRICKSTER_SHARE_ENABLED = "true"
PLAYABLE_DATA_ENABLED = "true"
FIELD_COMPAT_ENABLED = "true"
FIELD_V0_ENABLED = "true"
FIELD_QUERY_CACHE_TTL_SECONDS = "60"

FOMO_GALAXY_ENABLED = "true"
FOMO_REFRESH_MINUTES = "180"
FOMO_PROFILE_LOOKUPS_PER_REFRESH = "0"
FOMO_BOOTSTRAP_ENRICH_LIMIT = "10"
FOMO_ENRICH_TRADERS_PER_REFRESH = "1"
FOMOAPI_MONTHLY_CREDITS = "1000"
FOMOAPI_BREAKER_RATIO = "0.80"

# pump.fun and PonsFamily are retired as public galaxies. Historical launch-origin
# and research evidence remains in D1, but no galaxy-specific ranking/index refresh
# is enabled from production configuration.
HELIUS_BREAKER_RATIO = "0.75"
HELIUS_MONTHLY_CREDITS = "1000000"

# Conservative test mode: populate Universe sparingly while broad/history paths stay off.
ECOSYSTEM_UNIVERSES_ENABLED = "true"
INTELLIGENCE_MESH_ENABLED = "true"
INTELLIGENCE_SCHEDULER_BATCH_SIZE = "1"
# Authenticated normalized Yellowstone/Richat/Carbon bridge is production-ready but stays
# disabled until an upstream stream and INTELLIGENCE_MESH_INGEST_TOKEN are intentionally configured.
FULL_CHAIN_STREAM_ENABLED = "false"
BULL_INDEXER_ENABLED = "false"
BULL_NFT_INDEXER_ENABLED = "false"
BULL_ARCHIVAL_ENABLED = "false"
MARKET_BACKFILL_QUEUE_ENABLED = "true"
INTELLIGENCE_EXTERNAL_RETRIEVAL_ENABLED = "false"
INTELLIGENCE_SUBSTREAMS_HISTORY_ENABLED = "false"
INTELLIGENCE_OLD_FAITHFUL_HISTORY_ENABLED = "false"

# Required for Fomo Galaxy source data: npx wrangler secret put FOMOAPI_API_KEY --config workers/wrangler.production.toml
# Future full-chain stream bridge: npx wrangler secret put INTELLIGENCE_MESH_INGEST_TOKEN --config workers/wrangler.production.toml

Z500_UNIVERSE_ENABLED = "false"
Z500_HELIUS_ROTATION_ENABLED = "false"
Z500_TOP_LIMIT = "10"
Z500_REFRESH_SECONDS = "900"
Z500_CONFIRMATION_CYCLES = "2"

# Temporarily 120/60s for Colosseum/Cut smoke headroom (Replay→Cut→Share);
# tighten back toward 60 later if Galaxy traffic stays calm.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "8262026"
  [ratelimits.simple]
  limit = 120
  period = 60

[observability]
enabled = true
head_sampling_rate = 0.1

[[services]]
binding = "SOCIAL_AUTH"
service = "a-bulls-app-frontend"

[[d1_databases]]
binding = "INTELLIGENCE_DB"
database_name = "a-bulls-app-intelligence"
database_id = "a54ed900-ccd0-4fe5-9522-71996e96d16b"
migrations_dir = "migrations"
