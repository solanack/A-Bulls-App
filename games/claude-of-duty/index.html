<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#171820" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>A Bulls App — Solana Bang Bang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #171820; }
      body { font-family: Manrope, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
      #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      .bulls-home { position: fixed; z-index: 9999; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); width: 44px; height: 44px; display: grid; place-items: center; color: #f3f1f4; text-decoration: none; border: 1px solid rgba(196,175,207,.48); border-radius: 14px; background: rgba(41,42,52,.9); box-shadow: inset 0 1px rgba(255,255,255,.06),0 8px 20px rgba(7,7,11,.24); font: 700 20px/1 Manrope,system-ui,sans-serif; transition: transform 110ms ease,background-color 110ms ease,border-color 110ms ease; }
      .bulls-home:active { transform: translateY(1px) scale(.985); }
      .bulls-home:focus-visible { outline: 2px solid #b0d3c4; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <a class="bulls-home" href="../../index.html" aria-label="Return to A Bulls App" title="A Bulls App">⌂</a>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="./src/main.js?v=8.1.1"></script>
  </body>
