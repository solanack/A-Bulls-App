<!DOCTYPE html>
<html lang="en" class="dusk-atelier-direction">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#030307"/>
  <meta name="bbrs-build" content="8.8.0-vnext-73-field-query"/>
  <title>A Bulls App</title>
  <link rel="stylesheet" href="css/styles.css?v=8.8.0-vnext-73-field-query"/>
  <link rel="stylesheet" href="css/dusk-atelier.css?v=8.8.0-vnext-73-field-query"/>
  <link rel="stylesheet" href="css/product-shell-vnext.css?v=8.8.0-vnext-73-field-query"/>
  <link rel="stylesheet" href="css/field-shell.css?v=8.8.0-vnext-73-field-query"/>
  <link rel="stylesheet" href="css/query-experience.css?v=8.8.0-vnext-73-field-query"/>
</head>
<body class="dusk-atelier-direction">
  <pre id="bootlog" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:999999;max-height:40vh;overflow:auto;padding:12px;border-radius:16px;background:#12080c;color:#ffb4b4;font:12px/1.4 ui-monospace,monospace"></pre>
  <script>
    window.__abullsBootLog = (m) => {
      const n = document.getElementById('bootlog');
      if (!n) return;
      n.style.display = 'block';
      n.textContent = String(m || '');
    };
    window.addEventListener('error', (e) => window.__abullsBootLog(e.message || e.type));
    window.addEventListener('unhandledrejection', (e) => window.__abullsBootLog(e.reason?.message || e.reason || 'promise failed'));
  </script>
  <script src="js/config.js?v=8.8.0-vnext-73-field-query"></script>
  <script type="module" src="js/experience-entry.mjs?v=8.8.0-vnext-73-field-query"></script>
</body>
</html>
