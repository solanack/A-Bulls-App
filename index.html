<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/><meta name="theme-color" content="#020608"/><title>A Bulls App — Universe Flight</title><meta name="description" content="Explore Solana as a playable evidence field."/><link rel="manifest" href="manifest.webmanifest"/><link rel="icon" href="assets/icons/icon-192.png"/><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020608;color:#eafff7;font-family:Inter,system-ui,sans-serif}button,input{font:inherit}#universe{position:fixed;inset:0}#universeCanvas{width:100%;height:100%;display:block;touch-action:none}.chrome{position:fixed;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:space-between}.top,.bottom{pointer-events:auto;display:flex;gap:8px;align-items:center}.top{justify-content:space-between}.brand{padding:10px 13px;border:1px solid #ffffff20;background:#020608aa;backdrop-filter:blur(14px);border-radius:14px}.brand b{display:block;letter-spacing:.12em;font-size:12px}.brand small{opacity:.62;font-size:10px}.mode,.status{padding:9px 12px;border:1px solid #63ffc540;border-radius:999px;background:#04110ddd;color:#9effda;font-size:11px}.status{position:fixed;top:70px;left:50%;transform:translateX(-50%);pointer-events:none;max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom{overflow:auto;scrollbar-width:none}.bottom button{flex:0 0 auto;border:1px solid #ffffff1f;background:#020608c9;color:#d9fff2;border-radius:999px;padding:10px 13px;font-size:11px}.bottom button.active{border-color:#63ffc5;background:#0c3528}.panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,430px);border:1px solid #63ffc54a;background:#020a08e8;backdrop-filter:blur(22px);border-radius:22px;padding:18px;box-shadow:0 24px 80px #000}.panel[hidden]{display:none}.panel-head{display:flex;align-items:center;justify-content:space-between}.panel h2{margin:0;font-size:18px}.panel p{opacity:.7;line-height:1.45;font-size:13px}.panel input{width:100%;border:1px solid #ffffff25;background:#0008;color:white;border-radius:12px;padding:13px}.panel button{border:1px solid #ffffff25;background:#ffffff0c;color:white;border-radius:12px;padding:9px 12px}.hint{position:fixed;left:50%;top:12%;transform:translateX(-50%);pointer-events:none;color:#dfffee88;font-size:11px;text-align:center}.crosshair{position:fixed;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);border:1px solid #63ffc580;border-radius:50%;pointer-events:none}.crosshair:after{content:"";position:absolute;inset:6px;background:#63ffc5;border-radius:50%}</style></head><body><main id="universe"><canvas id="universeCanvas"></canvas><div class="crosshair"></div><div class="hint">DRAG / POINT TO STEER · HOLD TO THRUST · SPACE TO FIRE</div><div class="status" id="flightStatus">LOCAL FIELD · INTELLIGENCE READY</div><div class="chrome"><div class="top"><div class="brand"><b>A BULLS APP</b><small>PLAYABLE SOLANA INTELLIGENCE</small></div><div class="mode" id="modeName">EXPLORE</div></div><nav class="bottom"><button class="active" data-mode="EXPLORE">EXPLORE</button><button data-mode="WALLET">WALLET</button><button data-mode="TOKEN">TOKEN</button><button data-mode="NFT">NFT</button><button data-mode="PROGRAM">PROGRAM</button><button data-mode="REPLAY">REPLAY</button><button data-mode="COMPARE">COMPARE</button><button data-mode="WHAT IF">WHAT IF</button><button data-mode="SEQUENCES">SEQUENCES</button><button data-mode="CREATE">CREATE</button><button data-mode="EVIDENCE">EVIDENCE</button></nav><section class="panel" id="fieldPanel" hidden><div class="panel-head"><h2 id="panelTitle">WALLET</h2><button id="closePanel" aria-label="Close">×</button></div><p id="panelCopy"></p><input id="fieldInput" autocomplete="off" spellcheck="false"/><p><button id="enterField">ENTER FIELD</button></p></section></div></main><script src="universe-flight.js"></script><script src="universe-flight-data.js"></script><script>(()=>{const U=window.UniverseFlight,D=window.UniverseFlightData;if(!U)return;U.mount('#universeCanvas').start();const bs=[...document.querySelectorAll('[data-mode]')],p=document.getElementById('fieldPanel'),t=document.getElementById('panelTitle'),c=document.getElementById('panelCopy'),n=document.getElementById('modeName'),i=document.getElementById('fieldInput'),st=document.getElementById('flightStatus');function m(x){n.textContent=x;bs.forEach(b=>b.classList.toggle('active',b.dataset.mode===x));p.hidden=x==='EXPLORE';t.textContent=x;c.textContent=x==='WALLET'?'Enter a public Solana wallet. Read-only: no wallet connection or signature required.':`Enter an address or identifier to navigate the ${x} evidence field.`;i.placeholder=x==='WALLET'?'Public Solana wallet address':'Address or identifier'}bs.forEach(b=>b.onclick=()=>m(b.dataset.mode));document.getElementById('closePanel').onclick=()=>m('EXPLORE');document.getElementById('enterField').onclick=async()=>{const v=i.value.trim(),type=n.textContent.toLowerCase();if(!v)return;st.textContent='LOCATING DESTINATION…';p.hidden=true;try{const r=D?await D.travel(v,type):null;if(r?.indexed)st.textContent=`DESTINATION LOCKED · ${r.sector.entityCount||r.sector.particles.length} INDEXED CONTACTS`;else st.textContent='UNMAPPED SPACE · DESTINATION MARKED · NO INDEXED EVIDENCE';}catch{U.setDestination(v,type);st.textContent='INTELLIGENCE UNAVAILABLE · LOCAL NAVIGATION ACTIVE';}};if(D)D.loadUniverse('solana').then(r=>{st.textContent=`SOLANA FIELD · ${r.sector.particles.length} INDEXED CONTACTS`;}).catch(()=>{st.textContent='LOCAL FIELD · INTELLIGENCE OFFLINE';});})();</script></body></html>
