<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020608"><title>A Bulls App — Universe Flight</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020608;color:#eafff7;font-family:Inter,system-ui}button,input,select{font:inherit}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;padding:14px;display:flex;flex-direction:column;justify-content:space-between}.top,.nav,.time{display:flex;gap:7px;align-items:center;pointer-events:auto}.top{justify-content:space-between}.glass,.panel{border:1px solid #63ffc538;background:#020a08e8;backdrop-filter:blur(18px);border-radius:14px}.brand{padding:9px 12px}.brand b{display:block;font-size:12px;letter-spacing:.12em}.brand small{opacity:.6;font-size:9px}.status{position:fixed;top:66px;left:50%;transform:translateX(-50%);padding:8px 11px;font-size:10px;color:#9effda;max-width:90vw}.nav{overflow:auto}.nav button,.time button,.panel button,.jump{border:1px solid #ffffff20;background:#06100d;color:#dffff4;border-radius:999px;padding:9px 11px;font-size:10px;white-space:nowrap}.nav button.active{border-color:#63ffc5}.time{position:fixed;left:50%;bottom:65px;transform:translateX(-50%);padding:8px;max-width:94vw}.time[hidden],.panel[hidden],.jump[hidden]{display:none}.time input{width:min(36vw,260px)}.clock{font-size:9px;min-width:72px;text-align:center}.panel{pointer-events:auto;position:fixed;padding:15px}.dest{left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,430px)}.evidence{right:14px;top:105px;width:min(88vw,330px)}.head{display:flex;justify-content:space-between;align-items:center}.panel input,.panel select{width:100%;padding:11px;border:1px solid #ffffff22;border-radius:10px;background:#000b;color:#fff;margin:5px 0}.panel p{font-size:11px;opacity:.75}.badge{font-size:9px;color:#63ffc5}.warning{color:#ffd36a!important;font-weight:700}.cinematic{position:fixed;left:50%;top:18%;transform:translateX(-50%);font-weight:800;letter-spacing:.12em;text-align:center;text-shadow:0 2px 20px #000;pointer-events:none}.cinematic small{display:block;font-size:9px;color:#9effda;margin-top:5px}.jump{position:fixed;right:15px;bottom:70px;pointer-events:auto;border-color:#63ffc5;background:#0b2119e8;font-weight:800;letter-spacing:.08em}.warp{position:fixed;inset:0;pointer-events:none;overflow:hidden;background:radial-gradient(circle at center,transparent 0 8%,#04150f55 38%,#000d 100%);z-index:20}.warp[hidden]{display:none}.warp:before{content:"";position:absolute;inset:-80%;background:repeating-conic-gradient(from 0deg,#baffea 0 .12deg,transparent .15deg 2.8deg);animation:spin .8s linear infinite;mask-image:radial-gradient(circle,transparent 0 5%,#000 42%)}.warp .core{position:absolute;left:50%;top:50%;width:8vmin;height:8vmin;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 30px 10px #63ffc5,0 0 120px 40px #54aaff88}.warp .txt{position:absolute;left:50%;top:68%;transform:translate(-50%,-50%);font-size:12px;font-weight:900;letter-spacing:.25em;text-align:center;text-shadow:0 0 18px #63ffc5}.warp.decelerate:before{animation-duration:.18s}.warp.arrival{background:radial-gradient(circle at center,#fff 0,#63ffc588 5%,#020608 42%)}@keyframes spin{to{transform:rotate(360deg) scale(1.12)}}</style></head><body><canvas id="universeCanvas"></canvas><div class="warp" id="warp" hidden><div class="core"></div><div class="txt" id="warpText">CHARGING JUMP DRIVE</div></div><div class="cinematic" id="cinematic" hidden></div><div class="status glass" id="status">INITIALIZING UNIVERSE…</div><button class="jump" id="jump" hidden>⚡ JUMP TO DESTINATION</button><div class="hud"><div class="top"><div class="brand glass"><b>A BULLS APP</b><small>PLAYABLE SOLANA INTELLIGENCE</small></div><div class="glass" style="padding:8px 11px;font-size:10px" id="mode">EXPLORE</div></div><nav class="nav"><button class="active" data-mode="EXPLORE">EXPLORE</button><button data-mode="WALLET">WALLET</button><button data-mode="TOKEN">TOKEN</button><button data-mode="NFT">NFT</button><button data-mode="REPLAY">REPLAY</button><button data-mode="WHAT IF">WHAT IF</button><button data-mode="CREATE">CREATE</button><button data-mode="EVIDENCE">EVIDENCE</button></nav></div><div class="time glass" id="time" hidden><button id="rew">◀◀</button><button id="play">▶</button><button id="ff">▶▶</button><input id="scrub" type="range" min="0" max="1000"><span class="clock" id="clock">—</span><button id="spd">1×</button></div><section class="panel dest" id="dest" hidden><div class="head"><b id="destTitle">DESTINATION?</b><button id="closeDest">×</button></div><p id="destCopy"></p><input id="input"><p><button id="enter">ENTER FIELD</button></p></section><section class="panel dest" id="whatif" hidden><div class="head"><b>WHAT IF LAB</b><button id="closeWhat">×</button></div><p class="warning">SIMULATION — NOT OBSERVED CHAIN HISTORY</p><select id="action"><option value="hold">HOLD / NO ACTION</option><option value="buy">BUY</option><option value="sell">SELL</option></select><label>Intensity <input id="intensity" type="range" min="1" max="5" step=".25" value="1"></label><label>Volatility <input id="volatility" type="range" min="0" max="1" step=".05" value=".35"></label><label>Buy pressure <input id="pressure" type="range" min="0" max="1" step=".05" value=".5"></label><p><button id="branch">CREATE SIMULATED BRANCH</button></p></section><section class="panel dest" id="create" hidden><div class="head"><b>UNIVERSE MOVIE</b><button id="closeCreate">×</button></div><p>Turn the loaded replay into a directed cinematic sequence.</p><input id="movieTitle" value="MY UNIVERSE FLIGHT" maxlength="64"><p id="movieMeta">Load a destination first.</p><button id="buildMovie">BUILD MOVIE</button> <button id="playMovie">PLAY MOVIE</button> <button id="exportMovie">EXPORT PROJECT</button></section><aside class="panel evidence" id="card" hidden><div class="head"><span class="badge">EVIDENCE CONTACT</span><button id="closeCard">×</button></div><h3 id="evTitle"></h3><p id="evMeta"></p><p id="evProof"></p><button id="waypoint">SET WAYPOINT</button></aside><script src="universe-flight.js"></script><script src="universe-flight-data.js"></script><script src="universe-what-if.js"></script><script src="universe-movie.js"></script><script src="universe-warp.js"></script><script>(()=>{const U=UniverseFlight,D=UniverseFlightData,W=UniverseWhatIf,M=UniverseMovie,J=UniverseWarp,$=id=>document.getElementById(id),buttons=[...document.querySelectorAll('[data-mode]')];U.mount('#universeCanvas').start();let selected=null,speeds=[.5,1,2,4,8,16],si=1;function setMode(x){$('mode').textContent=x;buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===x));$('dest').hidden=['EXPLORE','REPLAY','WHAT IF','CREATE'].includes(x);$('whatif').hidden=x!=='WHAT IF';$('create').hidden=x!=='CREATE';$('time').hidden=!['REPLAY','WHAT IF','CREATE'].includes(x)}buttons.forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('closeDest').onclick=$('closeWhat').onclick=$('closeCreate').onclick=()=>setMode('EXPLORE');$('closeCard').onclick=()=>{$('card').hidden=true;selected=null};$('enter').onclick=async()=>{const v=$('input').value.trim(),type=$('mode').textContent.toLowerCase();if(!v)return;$('dest').hidden=true;const r=await D.travel(v,type);$('status').textContent=r.indexed?`DESTINATION LOCKED · ${r.sector.timeline.length} HISTORICAL EVENTS`:'UNMAPPED SPACE · NO INDEXED EVIDENCE';$('jump').hidden=false};$('jump').onclick=()=>{try{J.jump();$('jump').hidden=true}catch(e){$('status').textContent='LOCK A DESTINATION FIRST'}};addEventListener('universeflight:warp-start',()=>{$('warp').hidden=false;$('warp').className='warp';$('warpText').textContent='CHARGING JUMP DRIVE';$('status').textContent='JUMP DRIVE ENGAGED'});addEventListener('universeflight:warp-frame',e=>{const p=e.detail.phase;$('warp').className='warp '+p;$('warpText').textContent=p==='charge'?'CHARGING JUMP DRIVE':p==='warp'?'LIGHT SPEED':p==='decelerate'?'DROPPING FROM WARP':'DESTINATION ACQUIRED'});addEventListener('universeflight:warp-end',()=>{$('warp').className='warp arrival';$('warpText').textContent='DESTINATION REACHED';setTimeout(()=>$('warp').hidden=true,450);$('status').textContent='DESTINATION REACHED · FLIGHT CONTROLS RESTORED'});$('branch').onclick=()=>{try{const r=W.branch({at:U.state.clock.time,action:$('action').value,intensity:$('intensity').value,volatility:$('volatility').value,buyPressure:$('pressure').value});W.enter(r);$('whatif').hidden=true}catch(e){$('status').textContent='LOAD AN INDEXED TIMELINE FIRST'}};$('buildMovie').onclick=()=>{try{const p=M.build({title:$('movieTitle').value});$('movieMeta').textContent=`${p.shots.length} SHOTS · ${p.source.eventCount} EVENTS · ${p.source.kind.toUpperCase()}`}catch(e){$('movieMeta').textContent='Load an indexed replay first.'}};$('playMovie').onclick=()=>{try{M.play();$('create').hidden=true;$('mode').textContent='DIRECTOR MODE'}catch(e){$('status').textContent='BUILD MOVIE FIRST'}};$('exportMovie').onclick=()=>{try{M.exportProject()}catch(e){$('status').textContent='BUILD MOVIE FIRST'}};$('waypoint').onclick=()=>{if(selected){U.setDestination(selected.id,selected.entityKind);$('card').hidden=true;$('jump').hidden=false}};$('play').onclick=()=>U.state.clock.playing?U.pause():U.replay();$('rew').onclick=()=>U.seek(U.state.clock.time-(U.state.clock.max-U.state.clock.min)*.08);$('ff').onclick=()=>U.seek(U.state.clock.time+(U.state.clock.max-U.state.clock.min)*.08);$('spd').onclick=()=>{si=(si+1)%speeds.length;U.setSpeed(speeds[si]);$('spd').textContent=speeds[si]+'×'};$('scrub').oninput=e=>U.seek(U.state.clock.min+(U.state.clock.max-U.state.clock.min)*(e.target.value/1000));addEventListener('universeflight:evidence',e=>{selected=e.detail;$('card').hidden=false;$('evTitle').textContent=(selected.simulated?'SIMULATED ':'')+(selected.entityKind||'UNKNOWN').toUpperCase();$('evMeta').textContent=[selected.side,selected.category].filter(Boolean).join(' · ');$('evProof').textContent=selected.simulated?'Counterfactual simulation — NOT blockchain evidence.':selected.evidence?'Observed evidence reference attached.':'No inline evidence reference supplied.'});addEventListener('universeflight:time',e=>{const c=e.detail;if(!c.enabled)return;$('play').textContent=c.playing?'Ⅱ':'▶';$('scrub').value=c.max===c.min?0:Math.round((c.time-c.min)/(c.max-c.min)*1000);$('clock').textContent=c.time>1e8?new Date(c.time*1000).toLocaleTimeString():Math.round(c.time)});addEventListener('universeflight:movie-shot',e=>{const q=e.detail,el=$('cinematic');el.hidden=false;el.innerHTML=`${q.title||q.caption||q.kind.toUpperCase()}<small>${q.simulated?'SIMULATION · NOT OBSERVED':q.evidence?'EVIDENCE ATTACHED':'UNIVERSE FLIGHT'}</small>`;setTimeout(()=>el.hidden=true,1200)});D.loadUniverse('solana').then(r=>$('status').textContent=`SOLANA FIELD · ${r.sector.particles.length} CONTACTS`).catch(()=>$('status').textContent='LOCAL FIELD · INTELLIGENCE OFFLINE')})();</script></body></html>
