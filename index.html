<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/><meta name="theme-color" content="#020608"/><title>A Bulls App — Universe Flight</title><link rel="manifest" href="manifest.webmanifest"/><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020608;color:#eafff7;font-family:Inter,system-ui,sans-serif}button,input{font:inherit}canvas{width:100%;height:100%;display:block;touch-action:none}.chrome{position:fixed;inset:0;pointer-events:none;padding:14px;display:flex;flex-direction:column;justify-content:space-between}.top,.bottom{pointer-events:auto;display:flex;gap:8px;align-items:center}.top{justify-content:space-between}.brand,.mode,.status,.card{border:1px solid #63ffc538;background:#020a08df;backdrop-filter:blur(18px);border-radius:14px}.brand{padding:9px 12px}.brand b{display:block;font-size:12px;letter-spacing:.12em}.brand small{opacity:.6;font-size:9px}.mode,.status{padding:8px 11px;font-size:10px;color:#9effda}.status{position:fixed;top:67px;left:50%;transform:translateX(-50%);max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom{overflow:auto}.bottom button,.card button{flex:0 0 auto;border:1px solid #ffffff20;background:#06100d;color:#dffff4;border-radius:999px;padding:9px 12px;font-size:10px}.bottom button.active{border-color:#63ffc5}.panel,.card{pointer-events:auto;position:fixed;padding:16px}.panel{left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,430px);background:#020a08f3;border:1px solid #63ffc54a;border-radius:20px}.panel[hidden],.card[hidden]{display:none}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel input{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff22;background:#0008;color:white}.card{right:14px;top:108px;width:min(88vw,330px)}.card h3{margin:0 0 6px;font-size:13px}.card p{font-size:11px;opacity:.75;overflow-wrap:anywhere}.badge{font-size:9px;color:#63ffc5;letter-spacing:.1em}.hint{position:fixed;left:50%;top:12%;transform:translateX(-50%);font-size:10px;color:#dfffee77;pointer-events:none}.cross{position:fixed;left:50%;top:50%;width:15px;height:15px;transform:translate(-50%,-50%);border:1px solid #63ffc580;border-radius:50%;pointer-events:none}</style></head><body><canvas id="universeCanvas"></canvas><div class="cross"></div><div class="hint">TAP CONTACT TO SCAN · HOLD TO THRUST · SPACE TO FIRE PROBE · E TO SCAN NEAREST</div><div class="status" id="flightStatus">INITIALIZING UNIVERSE…</div><div class="chrome"><div class="top"><div class="brand"><b>A BULLS APP</b><small>PLAYABLE SOLANA INTELLIGENCE</small></div><div class="mode" id="modeName">EXPLORE</div></div><nav class="bottom"><button class="active" data-mode="EXPLORE">EXPLORE</button><button data-mode="WALLET">WALLET</button><button data-mode="TOKEN">TOKEN</button><button data-mode="NFT">NFT</button><button data-mode="PROGRAM">PROGRAM</button><button data-mode="REPLAY">REPLAY</button><button data-mode="COMPARE">COMPARE</button><button data-mode="WHAT IF">WHAT IF</button><button data-mode="SEQUENCES">SEQUENCES</button><button data-mode="CREATE">CREATE</button><button data-mode="EVIDENCE">EVIDENCE</button></nav></div><section class="panel" id="fieldPanel" hidden><div class="panel-head"><h3 id="panelTitle">DESTINATION?</h3><button id="closePanel">×</button></div><p id="panelCopy"></p><input id="fieldInput" autocomplete="off" spellcheck="false"/><p><button id="enterField">ENTER FIELD</button></p></section><aside class="card" id="evidenceCard" hidden><div class="panel-head"><span class="badge">EVIDENCE CONTACT</span><button id="closeEvidence">×</button></div><h3 id="evidenceTitle"></h3><p id="evidenceMeta"></p><p id="evidenceProof"></p><button id="flyToEvidence">SET WAYPOINT</button></aside><script src="universe-flight.js"></script><script src="universe-flight-data.js"></script><script>(()=>{const U=window.UniverseFlight,D=window.UniverseFlightData;if(!U)return;U.mount('#universeCanvas').start();const $=id=>document.getElementById(id),bs=[...document.querySelectorAll('[data-mode]')],p=$('fieldPanel'),card=$('evidenceCard'),st=$('flightStatus'),input=$('fieldInput');let selected=null;function mode(x){$('modeName').textContent=x;bs.forEach(b=>b.classList.toggle('active',b.dataset.mode===x));p.hidden=x==='EXPLORE';$('panelTitle').textContent=x==='EXPLORE'?'DESTINATION?':x;$('panelCopy').textContent=x==='WALLET'?'Enter a public Solana wallet. Read-only: no connection or signature required.':`Enter an address or identifier to navigate the ${x} evidence field.`;input.placeholder=x==='WALLET'?'Public Solana wallet address':'Address or identifier'}bs.forEach(b=>b.onclick=()=>mode(b.dataset.mode));$('closePanel').onclick=()=>mode('EXPLORE');$('closeEvidence').onclick=()=>{card.hidden=true;selected=null};$('flyToEvidence').onclick=()=>{if(selected){U.setDestination(selected.id,selected.entityKind);card.hidden=true;st.textContent='WAYPOINT LOCKED · '+selected.entityKind.toUpperCase()}};$('enterField').onclick=async()=>{const v=input.value.trim(),type=$('modeName').textContent.toLowerCase();if(!v)return;st.textContent='LOCATING DESTINATION…';p.hidden=true;const r=D?await D.travel(v,type):null;if(r?.indexed)st.textContent=`DESTINATION LOCKED · ${r.sector.particles.length} INDEXED CONTACTS`;else{U.setDestination(v,type);st.textContent='UNMAPPED SPACE · NO INDEXED EVIDENCE'}};addEventListener('universeflight:evidence',e=>{selected=e.detail;card.hidden=false;$('evidenceTitle').textContent=(selected.entityKind||'UNKNOWN').toUpperCase()+' · '+String(selected.id).slice(0,24);$('evidenceMeta').textContent=[selected.category,selected.magnitude!=null?'magnitude '+Number(selected.magnitude).toFixed(2):null].filter(Boolean).join(' · ')||'Indexed universe contact';$('evidenceProof').textContent=selected.evidence?'Evidence reference attached. Inspect mode preserves the underlying record.':'Coverage exists for this contact, but no inline evidence reference was supplied.';st.textContent='CONTACT SCANNED · EVIDENCE PRESERVED'});addEventListener('universeflight:arrival',e=>{st.textContent='DESTINATION ARRIVED · READY TO INSPECT / REPLAY / CREATE';if(e.detail.nearby)U.scan(e.detail.nearby)});addEventListener('universeflight:sector',e=>{if(e.detail.coverage)st.textContent=`FIELD LOADED · ${e.detail.particleCount} CONTACTS · BOUNDED COVERAGE`});if(D)D.loadUniverse('solana').then(r=>st.textContent=`SOLANA FIELD · ${r.sector.particles.length} INDEXED CONTACTS`).catch(()=>st.textContent='LOCAL FIELD · INTELLIGENCE OFFLINE')})();</script></body></html>
