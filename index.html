<!DOCTYPE html>
<html lang="en" class="dusk-atelier-direction">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#07070a"/>
  <meta name="bbrs-build" content="8.7.0-vnext"/>
  <title>A Bulls App</title>
  <meta name="description" content="Explore, investigate, replay, compare and turn verified Solana activity into interactive data stories."/>
  <link rel="manifest" href="manifest.webmanifest?v=8.7.0-vnext"/>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet"/>

  <!-- Bull Invaders keeps its proven game styling while the surrounding product is vNext. -->
  <link rel="stylesheet" href="css/styles.css?v=8.7.0-vnext"/>
  <link rel="stylesheet" href="css/dusk-atelier.css?v=8.7.0-vnext"/>
  <link rel="stylesheet" href="css/product-shell-vnext.css?v=2"/>

  <link rel="stylesheet" href="css/intelligence-event-inspector.css?v=5" data-intelligence-event-inspector="true"/>
  <link rel="stylesheet" href="css/bull-invaders-vnext.css?v=1"/>
</head>
<body class="dusk-atelier-direction">
  <div class="opening-sequence" id="openingSequence" aria-label="A Bulls App opening sequence">
    <video class="opening-video" id="openingVideo" src="assets/opening/opening-sequence.mp4" autoplay muted playsinline preload="metadata"></video>
    <span class="opening-art-backdrop opening-art-backdrop-title" aria-hidden="true"></span>
    <img class="opening-fade-card opening-fade-title" id="openingFadeTitle" src="assets/opening/opening-fade-1-title.jpg" alt="A Bulls App" decoding="async"/>
    <span class="opening-art-backdrop opening-art-backdrop-studio" aria-hidden="true"></span>
    <img class="opening-fade-card opening-fade-studio" id="openingFadeStudio" src="assets/opening/opening-fade-2-studio.png" alt="ImADingDong Productions" decoding="async"/>
  </div>

  <div class="toast" id="vnextToast" hidden role="status" aria-live="polite"></div>

  <script>
    (()=>{
      const toastNode=document.getElementById('vnextToast');
      let toastTimer=0;
      window.toast=window.toast||((message)=>{
        if(!toastNode)return;
        toastNode.textContent=String(message||'');
        toastNode.hidden=false;
        toastNode.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer=setTimeout(()=>{toastNode.classList.remove('show');toastNode.hidden=true;},2600);
      });
    })();
  </script>

  <!-- Shared read-only/game services retained because Bull Invaders still uses them. -->
  <script src="js/opening-sequence.js?v=8.7.0-vnext"></script>
  <script src="js/config.js?v=8.7.0-vnext"></script>
  <script src="js/api-client.js?v=8.7.0-vnext"></script>
  <script src="js/storage.js?v=8.7.0-vnext"></script>
  <script src="js/core.js?v=8.7.0-vnext"></script>
  <script src="js/background-manager.js?v=8.7.0-vnext"></script>
  <script src="js/audio-manager.js?v=8.7.0-vnext"></script>
  <script src="js/v7-art-system.js?v=8.7.0-vnext"></script>
  <script src="js/run-recorder.js?v=8.7.0-vnext"></script>
  <script src="js/share-card.js?v=8.7.0-vnext"></script>
  <script src="js/leaderboard.js?v=8.7.0-vnext"></script>
  <script src="js/run-mode.js?v=8.7.0-vnext"></script>
  <script src="vendor/pixi-8.19.0.min.js?v=8.7.0-vnext"></script>
  <script src="js/bull-invaders-renderer-v2.js?v=8.7.0-vnext"></script>
  <script src="js/bull-invaders.js?v=8.7.0-vnext"></script>
  <script src="js/main.js?v=8.7.0-vnext"></script>

  <!-- Canonical responsive product application. -->
  <script type="module" src="js/market-context-player-bridge.mjs?v=3"></script>
  <script type="module" src="js/experience-entry.mjs?v=4"></script>
</body>
</html>
