<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020608"><title>A Bulls App — Universe Flight</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020608;color:#eafff7;font-family:Inter,system-ui}button,input{font:inherit}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;padding:14px;display:flex;flex-direction:column;justify-content:space-between}.top,.nav,.time{display:flex;gap:7px;align-items:center;pointer-events:auto}.top{justify-content:space-between}.glass,.panel{border:1px solid #63ffc538;background:#020a08df;backdrop-filter:blur(18px);border-radius:14px}.brand{padding:9px 12px}.brand b{display:block;font-size:12px;letter-spacing:.12em}.brand small{opacity:.6;font-size:9px}.status{position:fixed;top:66px;left:50%;transform:translateX(-50%);padding:8px 11px;font-size:10px;color:#9effda;max-width:90vw}.nav{overflow:auto}.nav button,.time button,.panel button{border:1px solid #ffffff20;background:#06100d;color:#dffff4;border-radius:999px;padding:9px 11px;font-size:10px;white-space:nowrap}.nav button.active{border-color:#63ffc5}.time{position:fixed;left:50%;bottom:65px;transform:translateX(-50%);padding:8px;max-width:94vw}.time[hidden]{display:none}.time input{width:min(36vw,260px)}.clock{font-size:9px;min-width:72px;text-align:center}.panel{pointer-events:auto;position:fixed;padding:15px}.panel[hidden]{display:none}.dest{left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,430px)}.evidence{right:14px;top:105px;width:min(88vw,330px)}.head{display:flex;justify-content:space-between;align-items:center}.panel input{width:100%;padding:12px;border:1px solid #ffffff22;border-radius:10px;background:#0008;color:#fff}.panel p{font-size:11px;opacity:.75;overflow-wrap:anywhere}.badge{font-size:9px;color:#63ffc5}.hint{position:fixed;top:12%;left:50%;transform:translateX(-50%);font-size:9px;color:#dfffee70;pointer-events:none;text-align:center}</style></head><body><canvas id="universeCanvas"></canvas><div class="hint">TAP CONTACT TO SCAN · HOLD TO THRUST · FIRE PROBES · REPLAY HISTORY</div><div class="status glass" id="status">INITIALIZING UNIVERSE…</div><div class="hud"><div class="top"><div class="brand glass"><b>A BULLS APP</b><small>PLAYABLE SOLANA INTELLIGENCE</small></div><div class="glass" style="padding:8px 11px;font-size:10px" id="mode">EXPLORE</div></div><nav class="nav"><button class="active" data-mode="EXPLORE">EXPLORE</button><button data-mode="WALLET">WALLET</button><button data-mode="TOKEN">TOKEN</button><button data-mode="NFT">NFT</button><button data-mode="REPLAY">REPLAY</button><button data-mode="WHAT IF">WHAT IF</button><button data-mode="CREATE">CREATE</button><button data-mode="EVIDENCE">EVIDENCE</button></nav></div><div class="time glass" id="time" hidden><button id="rew">◀◀</button><button id="play">▶</button><button id="ff">▶▶</button><input id="scrub" type="range" min="0" max="1000" value="0"><span class="clock" id="clock">—</span><button id="spd">1×</button></div><section class="panel dest" id="dest" hidden><div class="head"><b id="destTitle">DESTINATION?</b><button id="closeDest">×</button></div><p id="destCopy"></p><input id="input" autocomplete="off"><p><button id="enter">ENTER FIELD</button></p></section><aside class="panel evidence" id="card" hidden><div class="head"><span class="badge">EVIDENCE CONTACT</span><button id="closeCard">×</button></div><h3 id="evTitle"></h3><p id="evMeta"></p><p id="evProof"></p><button id="waypoint">SET WAYPOINT</button></aside><script src="universe-flight.js"></script><script src="universe-flight-data.js"></script><script>(()=>{const U=UniverseFlight,D=UniverseFlightData,$=id=>document.getElementById(id),buttons=[...document.querySelectorAll('[data-mode]')];U.mount('#universeCanvas').start();let selected=null,speeds=[.5,1,2,4,8,16],si=1;function setMode(x){$('mode').textContent=x;buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===x));$('dest').hidden=x==='EXPLORE'||x==='REPLAY';$('time').hidden=x!=='REPLAY';$('destTitle').textContent=x;$('destCopy').textContent=x==='WALLET'?'Enter a public Solana wallet. Read-only; no connection or signature.':`Navigate the ${x} evidence field.`;if(x==='REPLAY'&&U.state.clock.enabled)U.replay()}buttons.forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('closeDest').onclick=()=>setMode('EXPLORE');$('closeCard').onclick=()=>{$('card').hidden=true;selected=null};$('enter').onclick=async()=>{const v=$('input').value.trim(),type=$('mode').textContent.toLowerCase();if(!v)return;$('status').textContent='LOCATING DESTINATION…';$('dest').hidden=true;const r=await D.travel(v,type);$('status').textContent=r.indexed?`DESTINATION LOCKED · ${r.sector.particles.length} CONTACTS · ${r.sector.timeline.length} HISTORICAL EVENTS`:'UNMAPPED SPACE · NO INDEXED EVIDENCE'};$('waypoint').onclick=()=>{if(selected){U.setDestination(selected.id,selected.entityKind);$('card').hidden=true}};$('play').onclick=()=>{U.state.clock.playing?U.pause():U.replay()};$('rew').onclick=()=>U.seek(U.state.clock.time-(U.state.clock.max-U.state.clock.min)*.08);$('ff').onclick=()=>U.seek(U.state.clock.time+(U.state.clock.max-U.state.clock.min)*.08);$('spd').onclick=()=>{si=(si+1)%speeds.length;U.setSpeed(speeds[si]);$('spd').textContent=speeds[si]+'×'};$('scrub').oninput=e=>U.seek(U.state.clock.min+(U.state.clock.max-U.state.clock.min)*(e.target.value/1000));addEventListener('universeflight:evidence',e=>{selected=e.detail;$('card').hidden=false;$('evTitle').textContent=(selected.entityKind||'UNKNOWN').toUpperCase()+' · '+String(selected.id).slice(0,24);$('evMeta').textContent=[selected.side,selected.category,selected.magnitude!=null?'magnitude '+Number(selected.magnitude).toFixed(2):null].filter(Boolean).join(' · ');$('evProof').textContent=selected.evidence?'Observed evidence reference attached.':'No inline evidence reference supplied.'});addEventListener('universeflight:market-event',e=>{$('status').textContent=(e.detail.side==='buy'?'BUY SURGE':e.detail.side==='sell'?'SELL SHOCKWAVE':'CHAIN EVENT')+' · '+(e.detail.entityKind||'EVENT').toUpperCase()});addEventListener('universeflight:time',e=>{const c=e.detail;if(!c.enabled)return;$('play').textContent=c.playing?'Ⅱ':'▶';$('scrub').value=c.max===c.min?0:Math.round((c.time-c.min)/(c.max-c.min)*1000);$('clock').textContent=c.time>1e8?new Date(c.time*1000).toLocaleTimeString():Math.round(c.time);});addEventListener('universeflight:arrival',e=>{$('status').textContent='DESTINATION ARRIVED · REPLAY AVAILABLE';if(e.detail.nearby)U.scan(e.detail.nearby)});D.loadUniverse('solana').then(r=>$('status').textContent=`SOLANA FIELD · ${r.sector.particles.length} CONTACTS`).catch(()=>$('status').textContent='LOCAL FIELD · INTELLIGENCE OFFLINE')})();</script></body></html>
