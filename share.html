<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050508">
  <title>A Bulls App · Verified Data Story</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f2fa;background:#050508}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(118,83,205,.24),transparent 38%),#050508;color:#f5f2fa}a{color:inherit}.share-root{width:min(960px,calc(100% - 28px));margin:auto;padding:24px 0 72px}.share-header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0 28px}.share-brand{text-decoration:none;font-weight:800;font-size:12px;letter-spacing:.15em}.share-badge{padding:7px 10px;border:1px solid rgba(220,205,255,.18);border-radius:999px;background:rgba(255,255,255,.04);font-size:9px;letter-spacing:.1em;color:#cfc4df}.share-hero,.share-card{border:1px solid rgba(220,205,255,.14);background:rgba(10,10,15,.7);backdrop-filter:blur(18px);box-shadow:0 24px 80px rgba(0,0,0,.28)}.share-hero{padding:clamp(22px,5vw,52px);border-radius:26px}.share-hero small{font-size:9px;letter-spacing:.13em;color:#b9a8d6}.share-hero h1{margin:12px 0 14px;font-size:clamp(34px,7vw,72px);line-height:.95;text-transform:capitalize}.share-hero p{max-width:720px;color:#bcb4c9;line-height:1.6}.share-meta{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:26px 0 0}.share-meta dt{color:#7f778b;font-size:9px;letter-spacing:.1em;text-transform:uppercase}.share-meta dd{margin:0;font-size:12px;overflow-wrap:anywhere}.share-card{margin-top:14px;padding:22px;border-radius:20px}.share-card h2{margin:0 0 14px;font-size:14px;letter-spacing:.08em;text-transform:uppercase}.share-list{margin:0;padding-left:20px;color:#c5becf}.share-list li{margin:9px 0;line-height:1.5}.share-list strong{color:#fff}.share-list small{display:block;margin-top:4px;color:#82798f;overflow-wrap:anywhere}.share-footer{margin-top:18px;padding:14px 4px;color:#7f778b;font-size:11px;line-height:1.6}.share-loading{min-height:60vh;display:grid;place-items:center;color:#a99dbd;font-size:11px;letter-spacing:.12em}@media(max-width:620px){.share-root{width:min(100% - 18px,960px);padding-top:14px}.share-header{align-items:flex-start}.share-badge{text-align:right}.share-meta{grid-template-columns:1fr}.share-meta dt{margin-top:7px}.share-card{padding:18px}}
  </style>
</head>
<body>
  <main id="shareRoot" class="share-root" aria-live="polite"></main>
  <script type="module" src="./js/trickster-share-view.mjs"></script>
</body>
</html>
